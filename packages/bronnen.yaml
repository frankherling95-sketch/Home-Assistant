# Bronnen — de ENIGE plek waar entiteiten van externe integraties genoemd worden.
#
# Dashboards, automatiseringen en andere packages gebruiken alleen de stabiele
# entiteiten hieronder (sensor.stroomprijs_nu, sensor.auto_accuniveau, …).
# Nieuwe auto, andere lader of andere energieleverancier: alleen dit bestand aanpassen.
#
# Entity-ID's van de bron opzoeken: Instellingen → Apparaten en diensten → Entiteiten.
# Regels met  # PAS AAN  hangen af van de naam van je apparaat.

template:
  - sensor:
      # ── Frank Energie ────────────────────────────────────────────────────
      - name: Stroomprijs nu
        unique_id: bron_stroomprijs_nu
        unit_of_measurement: "€/kWh"
        icon: mdi:currency-eur
        availability: "{{ has_value('sensor.current_electricity_price_all_in') }}"
        state: "{{ states('sensor.current_electricity_price_all_in') | float }}"
        attributes:
          # Alle bekende blokken (vandaag + morgen) als ISO-tijden, voor grafieken en planning.
          prices: >
            {% set ns = namespace(l=[]) %}
            {% for r in state_attr('sensor.current_electricity_price_all_in', 'prices') or [] %}
              {% set ns.l = ns.l + [{'from': as_datetime(r['from']).isoformat(),
                                     'till': as_datetime(r['till']).isoformat(),
                                     'price': r['price'] | float}] %}
            {% endfor %}
            {{ ns.l }}

      - name: Gasprijs nu
        unique_id: bron_gasprijs_nu
        unit_of_measurement: "€/m³"
        icon: mdi:fire
        availability: "{{ has_value('sensor.current_gas_price_all_in') }}"
        state: "{{ states('sensor.current_gas_price_all_in') | float }}"

      # ── Kia / Hyundai Connect ────────────────────────────────────────────
      - name: Auto accuniveau
        unique_id: bron_auto_accuniveau
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: "{{ has_value('sensor.auto_ev_battery_level') }}"  # PAS AAN
        state: "{{ states('sensor.auto_ev_battery_level') | float }}"  # PAS AAN

      - name: Auto bereik
        unique_id: bron_auto_bereik
        unit_of_measurement: km
        device_class: distance
        state_class: measurement
        availability: "{{ has_value('sensor.auto_ev_range') }}"  # PAS AAN
        state: "{{ states('sensor.auto_ev_range') | float }}"  # PAS AAN

      # ── Easee ────────────────────────────────────────────────────────────
      - name: Lader status
        unique_id: bron_lader_status
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.lader_status_easee') }}"  # PAS AAN
        state: "{{ states('sensor.lader_status_easee') }}"  # PAS AAN

      - name: Lader vermogen
        unique_id: bron_lader_vermogen
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.lader_power') }}"  # PAS AAN
        state: "{{ states('sensor.lader_power') | float }}"  # PAS AAN

      - name: Lader energie sessie
        unique_id: bron_lader_energie_sessie
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.lader_session_energy') }}"  # PAS AAN
        state: "{{ states('sensor.lader_session_energy') | float }}"  # PAS AAN

      # Voor het energiedashboard (Individuele apparaten): totale meterstand van de lader.
      - name: Lader energie totaal
        unique_id: bron_lader_energie_totaal
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.lader_lifetime_energy') }}"  # PAS AAN
        state: "{{ states('sensor.lader_lifetime_energy') | float }}"  # PAS AAN

  - binary_sensor:
      - name: Auto ingeplugd
        unique_id: bron_auto_ingeplugd
        device_class: plug
        availability: "{{ has_value('binary_sensor.auto_ev_battery_plug') }}"  # PAS AAN
        state: "{{ is_state('binary_sensor.auto_ev_battery_plug', 'on') }}"  # PAS AAN

      - name: Auto laadt
        unique_id: bron_auto_laadt
        device_class: battery_charging
        availability: "{{ has_value('binary_sensor.auto_ev_battery_charge') }}"  # PAS AAN
        state: "{{ is_state('binary_sensor.auto_ev_battery_charge', 'on') }}"  # PAS AAN

recorder:
  exclude:
    entities:
      # De koers zelf bewaart Frank Energie al; deze kopie draagt een groot
      # prices-attribuut en hoeft niet nog eens in de database.
      - sensor.stroomprijs_nu
