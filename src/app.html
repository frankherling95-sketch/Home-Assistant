<title>Staartploeg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --ground:#EDEDE8; --surface:#F9F9F6; --surface-2:#E4E5DE; --line:#D2D4CA;
  --ink:#15181C; --ink-2:#4B5057; --ink-3:#767C84;
  --accent:#1B49C4; --accent-ink:#FFFFFF; --accent-soft:#DFE6FA;
  --ok:#2C7A57; --ok-soft:#D6EBE0; --warn:#8F5A08; --warn-soft:#F3E4C4;
  --crit:#B5352A; --crit-soft:#F6DCD8;
  --shadow:0 1px 2px rgba(21,24,28,.06), 0 8px 24px -16px rgba(21,24,28,.35);
  --r:11px;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101317; --surface:#171B21; --surface-2:#1F242B; --line:#2D343D;
    --ink:#EAECE7; --ink-2:#AAB1B8; --ink-3:#8A929C;
    --accent:#89A4FF; --accent-ink:#0D1016; --accent-soft:#1D2942;
    --ok:#5DBE90; --ok-soft:#15291F; --warn:#DDA24A; --warn-soft:#2A2113;
    --crit:#E77265; --crit-soft:#2E1815;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#171B21; --surface-2:#1F242B; --line:#2D343D;
  --ink:#EAECE7; --ink-2:#AAB1B8; --ink-3:#8A929C;
  --accent:#89A4FF; --accent-ink:#0D1016; --accent-soft:#1D2942;
  --ok:#5DBE90; --ok-soft:#15291F; --warn:#DDA24A; --warn-soft:#2A2113;
  --crit:#E77265; --crit-soft:#2E1815;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:-.015em}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
[hidden]{display:none!important}
.shell{max-width:760px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}

/* ── header ─────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--line); padding:13px 16px 12px}
.brandrow{display:flex; align-items:center; gap:4px}
.brand{font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:-.03em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brand .dot{color:var(--accent)}
.hdrstats{display:flex; gap:8px; margin-top:11px}
.stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:9px 11px; min-width:0; text-align:left; cursor:pointer}
.stat b{display:block; font-family:var(--mono); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.15}
.stat span{display:block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat.accent b{color:var(--accent)} .stat.crit b{color:var(--crit)}

/* ── nav ────────────────────────────────────────────────── */
.nav{position:fixed; bottom:0; left:0; right:0; z-index:40; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.nav button{appearance:none; background:none; border:0; padding:9px 4px 11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3); border-top:2px solid transparent; margin-top:-1px}
.nav button[aria-selected="true"]{color:var(--accent); border-top-color:var(--accent)}
.glyph{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.nav .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:500}
main{flex:1; padding:18px 16px 100px}
@media (min-width:760px){
  .nav{position:sticky; bottom:auto; top:0; border-top:0; border-bottom:1px solid var(--line); max-width:760px; margin:0 auto}
  .nav button{flex-direction:row; gap:8px; padding:12px; border-top:0; border-bottom:2px solid transparent; margin-top:0}
  .nav button[aria-selected="true"]{border-bottom-color:var(--accent)}
  main{padding-bottom:60px}
}

/* ── generieke bouwstenen ───────────────────────────────── */
.stack{display:flex; flex-direction:column; gap:22px}
.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
h2.sec{font-size:18px; font-weight:600; margin-top:3px}
.lede{color:var(--ink-2); font-size:14px; max-width:62ch; margin-top:5px}
.btn{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:11px 15px; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; justify-content:center}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn-danger{color:var(--crit); border-color:var(--crit-soft)}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.btn-wide{width:100%}
.empty{text-align:center; padding:26px 16px; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--r)}
.pill{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:600; padding:3px 7px; border-radius:99px; white-space:nowrap; text-transform:uppercase; letter-spacing:.05em}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.idle{background:var(--surface-2); color:var(--ink-3)}
.pill.acc{background:var(--accent-soft); color:var(--accent)}
.money{font-family:var(--mono); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap}
.hr{height:1px; background:var(--line); border:0; margin:24px 0}
.sectitle{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px}

/* ── rijen ──────────────────────────────────────────────── */
.rows{display:flex; flex-direction:column; gap:7px; margin-top:11px}
.row{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:var(--r); padding:11px 13px; text-align:left; width:100%; font:inherit; cursor:pointer; appearance:none}
.row:hover{border-color:var(--ink-3)}
.row.crit{border-left-color:var(--crit)} .row.warn{border-left-color:var(--warn)} .row.ok{border-left-color:var(--ok)} .row.acc{border-left-color:var(--accent)}
.row .mark{width:23px; height:23px; border-radius:6px; border:1.5px solid var(--line); background:var(--ground); display:grid; place-items:center; flex:none}
.row .mark svg{width:13px; height:13px; stroke:var(--ground); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.row[data-done="1"] .mark{background:var(--ok); border-color:var(--ok)}
.row[data-done="1"] .mark svg{stroke:var(--surface)}
.row .txt{min-width:0}
.row .txt b{display:block; font-weight:600; font-size:14.5px; letter-spacing:-.005em}
.row[data-done="1"] .txt b{text-decoration:line-through; color:var(--ink-3)}
.row .txt span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.row .txt span em{font-style:normal; color:var(--ink-2)}
.row .right{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px}

/* ── ruimtekaarten ──────────────────────────────────────── */
.rcards{display:flex; flex-direction:column; gap:9px; margin-top:11px}
.rcard{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; width:100%; text-align:left; font:inherit; cursor:pointer}
.rcard:hover{border-color:var(--accent)}
.rcard strong{display:block; font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.012em}
.rbar{height:5px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:8px}
.rbar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.rmeta{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:6px; letter-spacing:.02em}
.rpct{font-family:var(--mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent); flex:none}
.rcard .thumbs{display:flex; gap:3px; margin-top:7px}
.rcard .thumbs i{width:16px; height:16px; border-radius:4px; display:block; border:1px solid var(--line); background-size:cover; background-position:center}

/* ── stappenplan ────────────────────────────────────────── */
.fase{display:grid; grid-template-columns:auto 1fr; gap:0 14px}
.fase .rail{display:flex; flex-direction:column; align-items:center}
.fase .pip{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:600; background:var(--surface); color:var(--ink-2); border:1.5px solid var(--line)}
.fase.actief .pip{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.fase.af .pip{background:var(--ok); color:var(--surface); border-color:var(--ok)}
.fase .wire{width:0; flex:1; border-left:2px dotted var(--line); margin:5px 0}
.fase .body{padding-bottom:22px; min-width:0}
.fase h3{font-size:16px; font-weight:600}
.fase .waarom{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.45}
.fase .telling{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:7px}
.fase .dep{margin-top:9px; font-size:12.5px; line-height:1.45; background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:9px 11px; max-width:58ch}
.fase.mijlpaal .pip{border-radius:8px}

/* ── paneel ─────────────────────────────────────────────── */
.panel{position:fixed; inset:0; z-index:60; background:var(--ground); display:flex; flex-direction:column; overflow:hidden}
.panel-top{position:sticky; top:0; background:var(--ground); border-bottom:1px solid var(--line); padding:11px 12px; display:flex; align-items:center; gap:8px; flex:none}
.panel-top h2{flex:1; font-size:17px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{appearance:none; background:none; border:0; padding:8px; cursor:pointer; color:var(--ink-2); display:grid; place-items:center; border-radius:8px; flex:none}
.iconbtn:hover{background:var(--surface-2)}
.panel-body{flex:1; overflow-y:auto; padding:16px 16px 40px; max-width:760px; width:100%; margin:0 auto; -webkit-overflow-scrolling:touch}

/* ── formulier ──────────────────────────────────────────── */
.field{display:block; margin-bottom:15px}
.field>span{display:block; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:600; margin-bottom:5px}
.field input, .field textarea, .field select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 12px; font-size:16px}
.field textarea{min-height:76px; resize:vertical; line-height:1.45}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent); outline:none}
.field .hint{font-size:12px; color:var(--ink-3); margin-top:5px; display:block}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{appearance:none; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chips.sm button{font-family:var(--mono); font-size:11px; padding:6px 11px; text-transform:uppercase; letter-spacing:.04em}

/* ── links & beeld ──────────────────────────────────────── */
.linkrow{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:6px}
.linkrow a{flex:1; min-width:0; color:var(--accent); text-decoration:none; font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.linkrow svg{width:14px; height:14px; stroke:var(--ink-3); fill:none; stroke-width:2; stroke-linecap:round; flex:none}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px; margin-top:10px}
.tile{position:relative; border-radius:9px; overflow:hidden; border:1px solid var(--line); background:var(--surface); aspect-ratio:1}
.tile img{width:100%; height:100%; object-fit:cover; display:block}
.tile .swatch{width:100%; height:100%; display:block}
.tile .cap{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent,rgba(0,0,0,.75)); color:#fff; font-size:10.5px; font-weight:600; padding:15px 7px 6px; line-height:1.25}
.tile .del{position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:15px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0}
.tile.add{border-style:dashed; display:grid; place-items:center; cursor:pointer; color:var(--ink-3); background:transparent; text-align:center}
.tile.add .plus{font-family:var(--mono); font-size:23px; line-height:1}
.tile.add small{display:block; font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px}

/* ── bord (vrij te schikken moodboard) ──────────────────── */
.bordwrap{position:relative; width:100%; margin-top:11px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; touch-action:none}
.bordwrap::before{content:""; position:absolute; inset:0; background-image:radial-gradient(var(--line) 1px, transparent 1px); background-size:20px 20px; opacity:.55; pointer-events:none}
.bord{position:absolute; top:0; left:0; width:600px; height:900px; transform-origin:0 0}
.bt{position:absolute; width:150px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--ground); box-shadow:0 2px 8px -4px rgba(0,0,0,.4); cursor:grab; user-select:none; touch-action:none}
.bt.pak{cursor:grabbing; z-index:5; box-shadow:0 10px 24px -8px rgba(0,0,0,.55); border-color:var(--accent)}
.bt .vlak{display:block; width:150px; height:150px; object-fit:cover}
.bt .bijs{padding:8px 9px 9px; font-size:12px; font-weight:600; line-height:1.3}
.bt.notitie{background:var(--warn-soft); border-color:var(--warn)}
.bt.notitie .bijs{font-weight:500; color:var(--ink); white-space:pre-wrap; font-size:12.5px; padding:11px}
.bt .wis{position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:15px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; opacity:0; transition:opacity .15s}
.bt:hover .wis, .bt.pak .wis{opacity:1}
.bordbalk{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
.schakel{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.schakel button{appearance:none; background:var(--surface); border:0; border-right:1px solid var(--line); padding:7px 12px; font-family:var(--mono); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); cursor:pointer}
.schakel button:last-child{border-right:0}
.schakel button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

/* ── opties vergelijken ─────────────────────────────────── */
.opties{display:flex; gap:9px; overflow-x:auto; padding:2px 2px 8px; margin-top:10px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
.optie{flex:0 0 176px; scroll-snap-align:start; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; display:flex; flex-direction:column}
.optie.gekozen{border-color:var(--ok); border-width:2px}
.optie .beeldvlak{width:100%; aspect-ratio:1; background:var(--surface-2); display:block; object-fit:cover}
.optie .leeg{width:100%; aspect-ratio:1; background:var(--surface-2); display:grid; place-items:center; color:var(--ink-3); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; cursor:pointer}
.optie .inhoud{padding:10px 11px 11px; display:flex; flex-direction:column; gap:5px; flex:1}
.optie .inhoud b{font-size:13.5px; font-weight:600; line-height:1.3}
.optie .inhoud .pr{font-family:var(--mono); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.optie .inhoud .nt{font-size:12px; color:var(--ink-3); line-height:1.4}
.optie .acties{display:flex; gap:5px; margin-top:auto; padding-top:8px}
.optie .acties button{flex:1; appearance:none; border:1px solid var(--line); background:var(--ground); border-radius:7px; padding:7px; font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; color:var(--ink-2)}
.optie .acties button.kies{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.optie.gekozen .acties button.kies{background:var(--ok-soft); color:var(--ok)}
.optie.nieuw{border-style:dashed; align-items:center; justify-content:center; min-height:150px; cursor:pointer; color:var(--ink-3); background:transparent}

/* ── brede tabel (alle onderdelen) ──────────────────────── */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); -webkit-overflow-scrolling:touch}
.tablewrap table{border-collapse:collapse; width:100%; min-width:760px; font-size:13.5px}
.tablewrap th, .tablewrap td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.tablewrap th{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:600; background:var(--surface-2); position:sticky; top:0; z-index:1}
.tablewrap tbody tr:last-child td{border-bottom:0}
.tablewrap tbody tr:hover td{background:var(--surface-2)}
.tablewrap td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.tablewrap td b{font-weight:600}

/* ── materiaaltabel ─────────────────────────────────────── */
.mtab{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px}
.mtab th{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:600; text-align:left; padding:7px 0; border-bottom:1px solid var(--line)}
.mtab td{padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top}
.mtab td:last-child{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500}
.mtab tr:last-child td{border-bottom:0}
.mtab .sub{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}
ol.werkwijze{margin:0; padding-left:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:9px}
ol.werkwijze li{display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:start; font-size:13.5px; color:var(--ink-2); line-height:1.5}
ol.werkwijze li::before{counter-increment:s; content:counter(s); font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:3px 7px; line-height:1.35}

/* ── setup ──────────────────────────────────────────────── */
.setup{max-width:520px; margin:0 auto}
.setup h1{font-size:26px; font-weight:800; letter-spacing:-.03em}

/* ── fab & toast ────────────────────────────────────────── */
.fab{position:fixed; right:16px; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:45; width:54px; height:54px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); cursor:pointer; display:grid; place-items:center; font-size:27px; line-height:1; font-family:var(--mono); padding:0 0 3px}
@media (min-width:760px){.fab{bottom:24px}}

<script>
(function(){
  "use strict";

  /* ═══ opslag ═════════════════════════════════════════════
     Eén JSON-object in localStorage; foto's apart in IndexedDB
     omdat ze niet in localStorage passen. Bewust één platte
     structuur: als we later naar een gedeelde database gaan,
     is dit één keer uploaden en klaar.
  ═════════════════════════════════════════════════════════ */
  var KEY = "staartploeg.data.v1", DB_NAAM = "staartploeg", DB_STORE = "beelden";
  var D = null, dbp = null;

  function leeg(){
    return {versie:1, project:{naam:"", sleutel:"", voorschouw:"", budget:0, buffer:12},
            ruimtes:[], items:[], klusjes:[], beeld:[], keuzes:[], punten:[]};
  }
  function laad(){
    var r;
    try { r = JSON.parse(localStorage.getItem(KEY)); } catch(e){ r = null; }
    if (!r || !r.versie) return leeg();
    /* v0.3 bewaarde "nodig" als week ten opzichte van de sleutel. Zet dat
       eenmalig om naar een gewone datum. */
    if (r.project && r.project.sleutel){
      var s = new Date(r.project.sleutel + "T12:00:00");
      (r.items || []).forEach(function(it){
        if (it.nodig == null && it.nodigWk != null && !isNaN(s)){
          var d = new Date(s); d.setDate(d.getDate() + Math.round(it.nodigWk*7));
          it.nodig = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
        }
        delete it.nodigWk;
      });
    }
    /* Nieuwe onderdelen die oudere opslag nog niet kent. */
    r.keuzes = r.keuzes || [];
    r.punten = r.punten || [];
    r.project = r.project || {};
    if (r.project.buffer == null) r.project.buffer = 12;
    if (r.project.voorschouw == null) r.project.voorschouw = "";
    return r;
  }
  var bewaarT;
  function bewaar(){
    clearTimeout(bewaarT);
    bewaarT = setTimeout(function(){
      try { localStorage.setItem(KEY, JSON.stringify(D)); }
      catch(e){ toast("Opslaan mislukt — geheugen vol?"); }
    }, 120);
  }
  function db(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var rq = indexedDB.open(DB_NAAM, 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore(DB_STORE); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function fotoZet(id, url){
    return db().then(function(d){ return new Promise(function(res, rej){
      var t = d.transaction(DB_STORE, "readwrite");
      t.objectStore(DB_STORE).put(url, id);
      t.oncomplete = res; t.onerror = function(){ rej(t.error); };
    }); });
  }
  function fotoHaal(id){
    return db().then(function(d){ return new Promise(function(res){
      var rq = d.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(id);
      rq.onsuccess = function(){ res(rq.result || null); };
      rq.onerror = function(){ res(null); };
    }); }).catch(function(){ return null; });
  }
  function fotoWeg(id){
    return db().then(function(d){
      d.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).delete(id);
    }).catch(function(){});
  }

  /* Eigen dialoog. prompt() en confirm() worden in een ingesloten
     frame geblokkeerd, en zijn op een telefoon sowieso onwerkbaar. */
  function sheet(opts){
    return new Promise(function(res){
      var bg = document.createElement("div");
      bg.className = "sheet-bg";
      var velden = (opts.velden || []).map(function(v){
        if (v.type === "kleur"){
          return '<div class="field"><span>' + esc(v.label) + "</span>" +
            '<div class="kleurkies"><input type="color" data-v="' + v.id + '" value="' + esc(v.waarde || "#B99A6B") + '">' +
            '<div class="kleurrij" data-voor="' + v.id + '">' + STALEN.map(function(k){
              return '<button type="button" data-kleur="' + k + '" style="background:' + k + '" aria-label="' + k + '"></button>';
            }).join("") + "</div></div></div>";
        }
        return '<label class="field"><span>' + esc(v.label) + "</span>" +
          '<input type="' + (v.type || "text") + '" data-v="' + v.id + '" value="' + esc(v.waarde || "") +
          '" placeholder="' + esc(v.plaats || "") + '" autocomplete="off"></label>';
      }).join("");
      bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h3>' + esc(opts.titel) + "</h3>" +
        (opts.uitleg ? '<p class="uitleg">' + esc(opts.uitleg) + "</p>" : '<div style="height:12px"></div>') +
        velden +
        '<div class="knoppen"><button class="btn" data-nee>' + esc(opts.nee || "Annuleren") + "</button>" +
        '<button class="btn ' + (opts.gevaar ? "btn-danger" : "btn-primary") + '" data-ja>' + esc(opts.ja || "Opslaan") + "</button></div></div>";
      document.body.appendChild(bg);
      var eerste = bg.querySelector("input[data-v]");
      if (eerste) setTimeout(function(){ eerste.focus(); eerste.select && eerste.select(); }, 60);
      function sluit(waarde){ bg.remove(); document.removeEventListener("keydown", toets); res(waarde); }
      function oogst(){
        var uit = {};
        $$("[data-v]", bg).forEach(function(i){ uit[i.dataset.v] = i.value; });
        return uit;
      }
      function toets(e){
        if (e.key === "Escape") sluit(null);
        if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "color") sluit(oogst());
      }
      document.addEventListener("keydown", toets);
      bg.addEventListener("click", function(e){
        if (e.target === bg) return sluit(null);
        if (e.target.closest("[data-nee]")) return sluit(null);
        if (e.target.closest("[data-ja]")) return sluit(opts.velden ? oogst() : {});
        var k = e.target.closest("[data-kleur]");
        if (k){
          var rij = k.closest(".kleurrij");
          $("[data-v='" + rij.dataset.voor + "']", bg).value = k.dataset.kleur;
          $$("[data-kleur]", rij).forEach(function(b){ b.setAttribute("aria-pressed", String(b === k)); });
        }
      });
    });
  }

      .then(function(r){ return r !== null; });
  }
  function klem(v, min, max){
    var n = Number(v);
    if (!isFinite(n)) return min;
    return Math.min(max, Math.max(min, n));

  function vandaag(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function sleutel(){
    if (!D.project.sleutel) return null;
    var d = new Date(D.project.sleutel + "T12:00:00");
    return isNaN(d) ? null : d;
  }
  function datumNaarWeek(str){
    var s = sleutel(); if (!s || !str) return null;
    var d = new Date(str + "T12:00:00"); if (isNaN(d)) return null;
    return Math.round((d - s)/(7*86400000));
  }
  function iso(d){
    return d ? d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") : "";
  }
  function fmt(d){ return d ? d.toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"2-digit"}) : "—"; }
  /* "Nodig op" is een gewone datum. Schuift de oplevering, dan vraagt de
     app of alle datums mee moeten schuiven — expliciet, want stilzwijgend
     data verplaatsen is erger dan een vraag stellen. */
  function nodigDatum(it){
    if (!it.nodig) return null;
    var d = new Date(it.nodig + "T12:00:00");
    return isNaN(d) ? null : d;
  }
  function bestelDatum(it){
    var n = nodigDatum(it); if (!n) return null;
    var d = new Date(n); d.setDate(d.getDate() - (Number(it.leverWk)||0)*7); return d;
  }
  function schuifDatums(dagen){
    D.items.forEach(function(it){
      var n = nodigDatum(it); if (!n) return;
      n.setDate(n.getDate() + dagen);
      it.nodig = iso(n);
    });
  }
  /* Beide kanten op middernacht zetten, anders telt een datum van
     vandaag+9 als 10 dagen door het halve etmaal verschil. */
  function dagenTot(d){
    if (!d) return null;
    var x = new Date(d); x.setHours(0,0,0,0);
    return Math.round((x - vandaag())/86400000);
  }
  function ruimteVan(id){
    for (var i=0;i<D.ruimtes.length;i++) if (D.ruimtes[i].id === id) return D.ruimtes[i];
    return null;
  }
  function itemsVan(rid){ return D.items.filter(function(i){ return i.ruimteId === rid; }); }
  function beeldVan(rid){ return D.beeld.filter(function(b){ return b.ruimteId === rid; }); }
  function urgentie(it){
    if (AF[it.status] || !TEBESTELLEN[it.status]) return null;
    var b = bestelDatum(it); if (!b) return null;
    var d = dagenTot(b);
    if (d < 0)   return {tone:"crit", tekst:Math.abs(d) + " dgn te laat", d:d};
    if (d <= 45) return {tone:"warn", tekst:"nog " + d + " dgn", d:d};
    return null;
  }

  function itemRij(it, metRuimte){
    var u = urgentie(it), r = ruimteVan(it.ruimteId);
    var tone = AF[it.status] ? "ok" : (u ? u.tone : "");
    var regels = [];
    if (metRuimte && r) regels.push(esc(r.naam));
    regels.push(KORT[it.status] || it.status);
    if (it.afmetingen) regels.push(esc(it.afmetingen));
    if (it.winkel) regels.push(esc(it.winkel));
    var b = bestelDatum(it);
    if (u && b) regels.push("bestel vóór <em>" + fmt(b) + "</em>");
    return '<button class="row ' + tone + '" data-item="' + it.id + '" data-done="' +
      (AF[it.status] ? 1 : 0) + '" type="button"><span class="mark">' + CHECK + "</span>" +
      '<span class="txt"><b>' + esc(it.naam) + "</b><span>" + regels.join(" · ") + "</span></span>" +
      '<span class="right">' + (u ? '<span class="pill ' + u.tone + '">' + u.tekst + "</span>" : "") +
      (Number(it.begroot) ? '<span class="money">' + kort(it.begroot) + "</span>" : "") + "</span></button>";
  }

  function tekenRuimtes(){
    var el = $('[data-view="ruimtes"]');
    if (!D.ruimtes.length){
      el.innerHTML = '<div class="empty">Nog geen ruimtes. Voeg er een toe via het menu rechtsboven.</div>';
      return;

    var kaarten = D.ruimtes.map(function(r){
      var list = itemsVan(r.id);
      var klaar = list.filter(function(i){ return AF[i.status]; }).length;
      var pct = list.length ? Math.round(klaar/list.length*100) : 0;
      var geld = list.reduce(function(a,i){ return a + (Number(i.begroot)||0); }, 0);
      var urg = list.filter(function(i){ return urgentie(i); }).length;
      var bd = beeldVan(r.id).slice(0,6).map(function(b){

          : '<i data-thumb="' + b.id + '" style="background:var(--surface-2)"></i>';

          (urg ? ' · <span style="color:var(--crit)">' + urg + " urgent</span>" : "")
        : "nog niets toegevoegd";

  function tekenStappen(){
    var el = $('[data-view="stappen"]');

    /* — koperskeuzes — */
    var open = D.keuzes.filter(function(k){ return k.status === "overweeg"; });

    var kSub = D.keuzes.length
      ? D.keuzes.filter(function(k){ return k.status === "besteld"; }).length + " besteld · " +

    uit.push(faseBlok({
      merk:"0", cls:open.length ? "actief" : "",

    }));

    /* — oplevering — */
    var open2 = D.punten.filter(function(p){ return p.status !== "hersteld"; }).length;
    var vs = D.project.voorschouw ? "voorschouw " + fmt(new Date(D.project.voorschouw + "T12:00:00")) : "";
    var sl = D.project.sleutel ? "oplevering " + fmt(sleutel()) : "geen datum";

      merk:"◆", cls:D.punten.length ? "actief" : "",
      titel:"Voorschouw & oplevering",
      waarom:"Leg elk gebrek concreet vast: ruimte, plek, aard, omvang en een foto. “Kras op raam” is te vaag om iets mee af te dwingen.",
      telling:[vs, sl].filter(Boolean).join(" · ") + (D.punten.length ? " · " + open2 + " van " + D.punten.length + " punten open" : ""),
      inhoud:'<button class="btn btn-wide" data-open-oplever style="margin-top:9px">' +
        (D.punten.length ? "Opleverpunten (" + D.punten.length + ")" : "Opleverpunten bijhouden") + "</button>"
    }));

    /* — de acht afbouwstappen — */
    var perFase = {};
    D.items.forEach(function(it){
      var f = (it.fase == null || it.fase === "") ? "x" : it.fase;
      (perFase[f] = perFase[f] || []).push(it);
    });
    var eersteOpen = -1;
    FASES.forEach(function(f, i){
      var list = perFase[i] || [];
      if (eersteOpen === -1 && list.some(function(it){ return !AF[it.status]; })) eersteOpen = i;
    });
    FASES.forEach(function(f, i){
      var list = perFase[i] || [];
      var klaar = list.filter(function(it){ return AF[it.status]; }).length;
      var af = list.length > 0 && klaar === list.length;
      uit.push(faseBlok({
        merk:af ? "✓" : String(i+1),
        cls:af ? "af" : (i === eersteOpen ? "actief" : ""),
        titel:f[0], waarom:f[1],
        telling:list.length ? klaar + " van " + list.length + " klaar" : "nog niets ingedeeld",
        wacht:WACHT[i],
        inhoud:list.length ? '<div class="rows">' + list.map(function(it){ return itemRij(it, true); }).join("") + "</div>" : ""
      }));
    });

    /* — na de oplevering — */
    uit.push(faseBlok({
      merk:"⏳", laatste:true, titel:"Onderhoudstermijn & garantie",
      waarom:"Na de oplevering loopt er een klok waar je niets voor hoeft te doen behalve op tijd melden.",
      inhoud:termijnenBlok()
    }));

    var zonder = perFase.x || [];
    el.innerHTML = '<div class="stack"><div><p class="eyebrow">Van koperskeuze tot garantie</p>' +
      '<h2 class="sec">De hele volgorde</h2>' +
      '<p class="lede">Stof, vocht en zware werkzaamheden bepalen de volgorde. Wie de vloer te vroeg legt, legt hem twee keer.</p>' +
      '<div style="margin-top:18px">' + uit.join("") + "</div></div>" +
      (zonder.length ? '<div><p class="eyebrow">Nog in te delen</p><h2 class="sec">Zonder stap</h2>' +
        '<p class="lede">Deze onderdelen staan nergens in de volgorde. Open ze en kies een stap.</p>' +
        '<div class="rows">' + zonder.map(function(it){ return itemRij(it, true); }).join("") + "</div></div>" : "") +
      "</div>";
  }

  function termijnenBlok(){
    var s = sleutel();
    if (!s) return '<p class="lede" style="font-size:13px">Vul een opleverdatum in bij de instellingen om de termijnen te zien.</p>';
    var termijnen = [
      [3, "5%-depot bij de notaris", "De aannemer moet je hier schriftelijk op wijzen. Het geld komt pas vrij als je punten hersteld zijn."],
      [6, "Onderhoudstermijn", "Kleine gebreken zoals krimpscheuren moet de aannemer in deze periode nog herstellen."],
      [72, "Garantie op technische onderdelen", "Op de meeste constructieve en technische onderdelen geldt zes jaar."]
    ];
    return '<div class="rows">' + termijnen.map(function(t){
      var eind = new Date(s); eind.setMonth(eind.getMonth() + t[0]);
      var dg = dagenTot(eind);
      var kleur = dg < 0 ? "idle" : (dg <= 45 ? "warn" : "ok");
      var tekst = dg < 0 ? "verlopen" : (dg <= 90 ? "nog " + dg + " dgn" : "tot " + fmt(eind));
      return '<div class="row" style="cursor:default"><span class="txt" style="grid-column:1/3"><b>' + esc(t[1]) + "</b>" +
        "<span>" + esc(t[2]) + "</span></span>" +
        '<span class="right"><span class="pill ' + kleur + '">' + tekst + "</span></span></div>";
    }).join("") + "</div>";
  }

  /* ═══ tabelweergave ══════════════════════════════════════ */
  var tabelSort = {kolom:"ruimte", omgekeerd:false};
  function openTabel(){
    var KOLOMMEN = [
      ["naam", "Onderdeel", function(i){ return i.naam; }],
      ["ruimte", "Ruimte", function(i){ var r = ruimteVan(i.ruimteId); return r ? r.naam : ""; }],
      ["status", "Status", function(i){ return LABEL[i.status] || i.status; }],
      ["afmetingen", "Afmetingen", function(i){ return i.afmetingen || ""; }],
      ["winkel", "Winkel", function(i){ return i.winkel || ""; }],
      ["artikelnr", "Artikelnr.", function(i){ return i.artikelnr || ""; }],
      ["begroot", "Prijs", function(i){ return Number(i.begroot) || 0; }],
      ["nodig", "Nodig op", function(i){ return i.nodig || ""; }],
      ["bestel", "Bestel vóór", function(i){ var b = bestelDatum(i); return b ? iso(b) : ""; }]
    ];
    var p = openPaneel("Alle onderdelen",
      '<p class="lede" style="margin:0 0 14px">Tik op een kolomkop om te sorteren, en op een regel om het onderdeel te openen. Schuif opzij voor de rest van de kolommen.</p>' +
      '<div id="t-uit"></div>');

    function teken(){
      var kol = KOLOMMEN.filter(function(k){ return k[0] === tabelSort.kolom; })[0] || KOLOMMEN[1];
      var rijen = D.items.slice().sort(function(a, b){
        var va = kol[2](a), vb = kol[2](b);
        var r = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "nl");
        return tabelSort.omgekeerd ? -r : r;
      });
      $("#t-uit", p).innerHTML = D.items.length
        ? '<div class="tablewrap"><table><thead><tr>' +
          KOLOMMEN.map(function(k){
            var actief = k[0] === tabelSort.kolom;
            return '<th data-sort="' + k[0] + '" style="cursor:pointer; white-space:nowrap' +
              (actief ? "; color:var(--accent)" : "") + '">' + esc(k[1]) +
              (actief ? (tabelSort.omgekeerd ? " ↑" : " ↓") : "") + "</th>";
          }).join("") + "</tr></thead><tbody>" +
          rijen.map(function(i){
            return '<tr data-item="' + i.id + '" style="cursor:pointer">' + KOLOMMEN.map(function(k){
              var v = k[2](i);
              if (k[0] === "begroot") return '<td class="num">' + (v ? euro(v) : "—") + "</td>";
              if (k[0] === "nodig" || k[0] === "bestel") return '<td class="num">' + (v ? fmt(new Date(v + "T12:00:00")) : "—") + "</td>";
              if (k[0] === "status") return "<td>" + esc(v) + "</td>";
              if (k[0] === "naam") return "<td><b>" + esc(v) + "</b></td>";
              return "<td>" + (v ? esc(v) : '<span style="color:var(--ink-3)">—</span>') + "</td>";
            }).join("") + "</tr>";
          }).join("") + "</tbody></table></div>" +
          '<p class="lede" style="font-size:12.5px">' + D.items.length +
          " onderdelen · " + euro(D.items.reduce(function(a, i){ return a + (Number(i.begroot) || 0); }, 0)) + " begroot</p>"
        : '<div class="empty">Nog geen onderdelen.</div>';
    }
    teken();

    p.addEventListener("click", function(e){
      var th = e.target.closest("[data-sort]");
      if (th){
        if (tabelSort.kolom === th.dataset.sort) tabelSort.omgekeerd = !tabelSort.omgekeerd;
        else { tabelSort.kolom = th.dataset.sort; tabelSort.omgekeerd = false; }
        teken(); return;
      }
      var tr = e.target.closest("[data-item]");
      if (tr) openItem(tr.dataset.item);
    });
  }

  /* ═══ koperskeuzes ═══════════════════════════════════════ */
  var KSTATUS = {overweeg:"Nog beslissen", besteld:"Besteld", afgewezen:"Niet doen"};

  function keuzeUrgentie(k){
    if (k.status !== "overweeg" || !k.sluiting) return null;
    var dg = dagenTot(new Date(k.sluiting + "T12:00:00"));
    if (dg < 0)   return {tone:"idle", tekst:"gesloten", d:dg};
    if (dg <= 14) return {tone:"crit", tekst:"nog " + dg + " dgn", d:dg};
    if (dg <= 60) return {tone:"warn", tekst:"nog " + dg + " dgn", d:dg};
    return {tone:"ok", tekst:fmt(new Date(k.sluiting + "T12:00:00")), d:dg};
  }
  function keuzeRij(k){
    var u = keuzeUrgentie(k);
    var regels = [KSTATUS[k.status] || k.status];
    if (k.sluiting) regels.push("sluit <em>" + fmt(new Date(k.sluiting + "T12:00:00")) + "</em>");
    return '<button class="row ' + (k.status === "besteld" ? "ok" : (u ? u.tone : "")) +
      '" data-keuze="' + k.id + '" data-done="' + (k.status === "besteld" ? 1 : 0) + '" type="button">' +
      '<span class="mark">' + CHECK + "</span>" +
      '<span class="txt"><b>' + esc(k.naam) + "</b><span>" + regels.join(" · ") + "</span></span>" +
      '<span class="right">' + (u && u.tone !== "ok" ? '<span class="pill ' + u.tone + '">' + u.tekst + "</span>" : "") +
      (Number(k.prijs) ? '<span class="money">' + kort(k.prijs) + "</span>" : "") + "</span></button>";
  }

  function openKeuzes(){
    var html =
      '<p class="lede" style="margin:0 0 16px">Elke bouwfase heeft een eigen sluitingsdatum. Daarna kan een technische wijziging niet meer — leidingen liggen in de vloer, wanden staan. Dit zijn de enige deadlines in dit project die nooit opschuiven.</p>' +
      '<div id="k-lijst"></div>' +
      '<button class="btn btn-primary btn-wide" data-knieuw style="margin-top:12px; padding:13px">+ Koperskeuze toevoegen</button>' +
      '<hr class="hr"><p class="eyebrow">Denk hieraan</p><h2 class="sec">Wat je nu nog kunt regelen</h2>' +
      '<p class="lede">Tik iets aan om het als koperskeuze over te nemen. Achteraf is dit hakken en frezen, of helemaal onmogelijk.</p>' +
      '<div class="rows" id="k-ideeen"></div>';
    var p = openPaneel("Koperskeuzes", html);

    function tekenLijst(){
      var g = {overweeg:[], besteld:[], afgewezen:[]};
      D.keuzes.forEach(function(k){ (g[k.status] || g.overweeg).push(k); });
      g.overweeg.sort(function(a,b){ return (a.sluiting || "9") < (b.sluiting || "9") ? -1 : 1; });
      var deel = function(titel, list){
        return list.length ? '<div style="margin-top:14px"><p class="eyebrow">' + titel + "</p>" +
          '<div class="rows">' + list.map(keuzeRij).join("") + "</div></div>" : "";
      };
      $("#k-lijst", p).innerHTML = D.keuzes.length
        ? deel("Nog beslissen", g.overweeg) + deel("Besteld", g.besteld) + deel("Niet doen", g.afgewezen)
        : '<div class="empty">Nog geen koperskeuzes vastgelegd.</div>';
      var gebruikt = D.keuzes.map(function(k){ return k.naam.toLowerCase(); });
      $("#k-ideeen", p).innerHTML = MEERWERK_IDEEEN
        .filter(function(m){ return gebruikt.indexOf(m[0].toLowerCase()) === -1; })
        .map(function(m){
          return '<button class="row acc" data-kidee="' + esc(m[0]) + '" type="button">' +
            '<span class="mark" style="border-style:dashed"></span>' +
            '<span class="txt"><b>' + esc(m[0]) + "</b><span>" + esc(m[1]) + "</span></span>" +
            '<span class="right"><span class="pill acc">+</span></span></button>';
        }).join("") || '<div class="empty">Je hebt ze allemaal al staan.</div>';
    }
    tekenLijst();

    p.addEventListener("click", function(e){
      if (e.target.closest("[data-knieuw]")) return bewerkKeuze(null, tekenLijst);
      var r = e.target.closest("[data-keuze]");
      if (r) return bewerkKeuze(r.dataset.keuze, tekenLijst);
      var i = e.target.closest("[data-kidee]");
      if (i){
        var naam = i.dataset.kidee;
        var beschrijving = (MEERWERK_IDEEEN.filter(function(m){ return m[0] === naam; })[0] || [])[1] || "";
        D.keuzes.push({id:uid(), naam:naam, notitie:beschrijving, sluiting:"", prijs:0, status:"overweeg"});
        bewaar(); tekenLijst(); toast("Toegevoegd — zet er nog een sluitingsdatum bij");
      }
    });
  }

  function bewerkKeuze(id, klaar){
    var nieuw = !id;
    var bron = nieuw ? {id:uid(), naam:"", notitie:"", sluiting:"", prijs:0, status:"overweeg"}
                     : D.keuzes.filter(function(x){ return x.id === id; })[0];
    if (!bron) return;
    var k = JSON.parse(JSON.stringify(bron));
    var html =
      '<label class="field"><span>Wat wil je laten doen?</span><input id="k-naam" type="text" value="' + esc(k.naam) + '" placeholder="Extra stopcontacten woonkamer" autocomplete="off"></label>' +
      '<div class="field"><span>Status</span><div class="chips" id="k-status">' +
        Object.keys(KSTATUS).map(function(s){ return '<button type="button" data-ks="' + s + '" aria-pressed="' + (k.status === s) + '">' + KSTATUS[s] + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="duo">' +
        '<label class="field"><span>Sluitingsdatum</span><input id="k-sluit" type="date" value="' + esc(k.sluiting) + '"></label>' +
        '<label class="field"><span>Prijs (€)</span><input id="k-prijs" type="number" inputmode="numeric" min="0" step="10" value="' + (Number(k.prijs)||"") + '"></label>' +
      "</div>" +
      '<div class="field" id="k-teller"></div>' +
      '<label class="field"><span>Notitie</span><textarea id="k-notitie" placeholder="Waar precies, welke hoogte, wat zei de kopersbegeleider…">' + esc(k.notitie) + "</textarea></label>" +
      '<div class="btn-row"><button class="btn btn-primary" data-ksave style="flex:1; padding:14px">Opslaan</button>' +
      (nieuw ? "" : '<button class="btn btn-danger" data-kweg>Verwijderen</button>') + "</div>";
    var p = openPaneel(nieuw ? "Nieuwe koperskeuze" : k.naam, html);

    function teller(){
      var v = $("#k-sluit", p).value;
      var el = $("#k-teller", p);
      if (!v) return void (el.innerHTML = '<span class="hint">Zonder sluitingsdatum kan de app je hier niet aan herinneren. Vraag hem op bij je kopersbegeleider.</span>');
      var dg = dagenTot(new Date(v + "T12:00:00"));
      var kleur = dg < 0 ? "idle" : (dg <= 14 ? "crit" : (dg <= 60 ? "warn" : "ok"));
      el.innerHTML = "<span>Tijd tot sluiting</span>" +
        '<div class="linkrow" style="margin:0"><b style="flex:1; font-family:var(--mono); font-size:14px">' + fmt(new Date(v + "T12:00:00")) + "</b>" +
        '<span class="pill ' + kleur + '">' + (dg < 0 ? "gesloten" : "nog " + dg + " dgn") + "</span></div>" +
        '<span class="hint">' + (dg < 0 ? "Deze datum is voorbij. Bel je kopersbegeleider of dit nog kan." : "Na deze datum ligt het vast.") + "</span>";
    }
    teller();
    p.addEventListener("input", function(e){ if (e.target.id === "k-sluit") teller(); });
    p.addEventListener("click", function(e){
      var s = e.target.closest("[data-ks]");
      if (s){
        k.status = s.dataset.ks;
        $$("[data-ks]", p).forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.ks === k.status)); });
        return;
      }
      if (e.target.closest("[data-kweg]")){
        bevestig("“" + k.naam + "” verwijderen?", "Dit kan niet ongedaan gemaakt worden.").then(function(ja){
          if (!ja) return;
          D.keuzes = D.keuzes.filter(function(x){ return x.id !== k.id; });
          bewaar(); sluitPaneel(p); if (klaar) klaar(); toast("Verwijderd");
        });
        return;
      }
      if (e.target.closest("[data-ksave]")){
        var naam = $("#k-naam", p).value.trim();
        if (!naam) return toast("Geef het een naam");
        k.naam = naam;
        k.sluiting = $("#k-sluit", p).value || "";
        k.prijs = klem($("#k-prijs", p).value, 0, 9999999);
        k.notitie = $("#k-notitie", p).value;
        if (nieuw) D.keuzes.push(k);
        else D.keuzes = D.keuzes.map(function(x){ return x.id === k.id ? k : x; });
        bewaar(); sluitPaneel(p); if (klaar) klaar(); toast(nieuw ? "Toegevoegd" : "Opgeslagen");
      }
    });
    if (nieuw) setTimeout(function(){ $("#k-naam", p).focus(); }, 60);
  }

  /* ═══ opleverpunten ══════════════════════════════════════ */
  var PSTATUS = {gemeld:"Gemeld", erkend:"Erkend", hersteld:"Hersteld"};

  function puntRij(pt){
    var r = ruimteVan(pt.ruimteId);
    var regels = [r ? esc(r.naam) : "geen ruimte"];
    if (pt.locatie) regels.push(esc(pt.locatie));
    if (pt.omvang) regels.push(esc(pt.omvang));
    var tone = pt.status === "hersteld" ? "ok" : (pt.status === "erkend" ? "warn" : "crit");
    return '<button class="row ' + tone + '" data-punt="' + pt.id + '" data-done="' +
      (pt.status === "hersteld" ? 1 : 0) + '" type="button"><span class="mark">' + CHECK + "</span>" +
      '<span class="txt"><b>' + esc(pt.aard || "Gebrek") + "</b><span>" + regels.join(" · ") + "</span></span>" +
      '<span class="right"><span class="pill ' + tone + '">' + (PSTATUS[pt.status] || pt.status) + "</span></span></button>";
  }

    var html =
      '<div class="duo">' +
        '<label class="field"><span>Voorschouw</span><input id="o-vs" type="date" value="' + esc(D.project.voorschouw) + '"></label>' +
        '<label class="field"><span>Oplevering</span><input id="o-op" type="date" value="' + esc(D.project.sleutel) + '"></label>' +
      "</div>" +
      '<p class="lede" style="margin:0 0 16px">De voorschouw is meestal ongeveer twee weken vóór de oplevering. Daar kun je gebreken al vastleggen, zodat ze bij de oplevering hersteld zijn.</p>' +
      '<div id="o-lijst"></div>' +
      '<button class="btn btn-primary btn-wide" data-pnieuw style="margin-top:12px; padding:13px">+ Opleverpunt toevoegen</button>' +
      '<hr class="hr"><p class="eyebrow">Waarom zo precies</p>' +
      '<p class="lede">Een punt is alleen afdwingbaar als het concreet is. “Kras op raam” is te vaag: noteer de ruimte, wáár in die ruimte, wat het is, hoe groot, en maak een foto. Houd de tekeningen van je meerwerk erbij en controleer of loze leidingen en extra punten er echt zitten.</p>' +
      '<div style="margin-top:14px">' + termijnenBlok() + "</div>";
    var p = openPaneel("Oplevering", html);

    function tekenLijst(){
      var g = {gemeld:[], erkend:[], hersteld:[]};
      D.punten.forEach(function(pt){ (g[pt.status] || g.gemeld).push(pt); });
      var deel = function(t, list){
        return list.length ? '<div style="margin-top:14px"><p class="eyebrow">' + t + "</p>" +
          '<div class="rows">' + list.map(puntRij).join("") + "</div></div>" : "";
      };
      $("#o-lijst", p).innerHTML = D.punten.length
        ? deel("Gemeld", g.gemeld) + deel("Erkend", g.erkend) + deel("Hersteld", g.hersteld)
        : '<div class="empty">Nog geen opleverpunten.</div>';

    tekenLijst();

    p.addEventListener("change", function(e){
      if (e.target.id === "o-vs"){ D.project.voorschouw = e.target.value; bewaar(); }
      if (e.target.id === "o-op"){ D.project.sleutel = e.target.value; bewaar(); tekenKop(); }
    });
    p.addEventListener("click", function(e){
      if (e.target.closest("[data-pnieuw]")) return bewerkPunt(null, tekenLijst);
      var r = e.target.closest("[data-punt]");
      if (r) return bewerkPunt(r.dataset.punt, tekenLijst);
    });
  }

  function bewerkPunt(id, klaar){
    var nieuw = !id;
    var bron = nieuw ? {id:uid(), ruimteId:(D.ruimtes[0]||{}).id, locatie:"", aard:"", omvang:"",
                        status:"gemeld", fotoId:"", gemeld:iso(vandaag()), notitie:""}
                     : D.punten.filter(function(x){ return x.id === id; })[0];
    if (!bron) return;
    var pt = JSON.parse(JSON.stringify(bron));
    var html =
      '<label class="field"><span>Wat is er mis?</span><input id="o-aard" type="text" value="' + esc(pt.aard) + '" placeholder="Kras in het kozijn" autocomplete="off"></label>' +
      '<label class="field"><span>In welke ruimte?</span><select id="o-ruimte">' +
        D.ruimtes.map(function(r){ return '<option value="' + r.id + '"' + (r.id === pt.ruimteId ? " selected" : "") + ">" + esc(r.naam) + "</option>"; }).join("") +
      "</select></label>" +
      '<label class="field"><span>Waar precies in die ruimte?</span><input id="o-loc" type="text" value="' + esc(pt.locatie) + '" placeholder="Linkerkozijn achterdeur, onderste 30 cm" autocomplete="off">' +
      '<span class="hint">Zonder plek is het punt niet terug te vinden en dus niet af te dwingen.</span></label>' +
      '<label class="field"><span>Hoe groot?</span><input id="o-omv" type="text" value="' + esc(pt.omvang) + '" placeholder="Ongeveer 8 cm lang, 1 mm diep" autocomplete="off"></label>' +
      '<div class="field"><span>Status</span><div class="chips" id="o-status">' +
        Object.keys(PSTATUS).map(function(s){ return '<button type="button" data-ps="' + s + '" aria-pressed="' + (pt.status === s) + '">' + PSTATUS[s] + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="field"><span>Foto</span><div class="tiles" id="o-foto"></div>' +
      '<input type="file" id="o-file" accept="image/*" hidden></div>' +
      '<label class="field"><span>Notitie</span><textarea id="o-not" placeholder="Wat zei de opzichter? Afgesproken hersteldatum?">' + esc(pt.notitie) + "</textarea></label>" +
      '<div class="btn-row"><button class="btn btn-primary" data-osave style="flex:1; padding:14px">Opslaan</button>' +
      (nieuw ? "" : '<button class="btn btn-danger" data-oweg>Verwijderen</button>') + "</div>";
    var p = openPaneel(nieuw ? "Nieuw opleverpunt" : (pt.aard || "Opleverpunt"), html);

    function tekenFoto(){
      $("#o-foto", p).innerHTML = pt.fotoId
        ? '<div class="tile"><img alt="Opleverpunt" id="o-img"><button class="del" data-ofotoweg aria-label="Verwijderen">×</button></div>'
        : '<button class="tile add" data-ofoto type="button"><span><span class="plus">+</span><small>foto</small></span></button>';
      if (pt.fotoId) fotoHaal(pt.fotoId).then(function(u){ var i = $("#o-img", p); if (i && u) i.src = u; });
    }
    tekenFoto();

    $("#o-file", p).addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0]; if (!f) return;
      e.target.value = "";
      verkleinFoto(f).then(function(u){
        var fid = uid();
        return fotoZet(fid, u).then(function(){ pt.fotoId = fid; tekenFoto(); });
      }).catch(function(){ toast("Die foto lukte niet"); });
    });
    p.addEventListener("click", function(e){
      var s = e.target.closest("[data-ps]");
      if (s){
        pt.status = s.dataset.ps;
        $$("[data-ps]", p).forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.ps === pt.status)); });
        return;
      }
      if (e.target.closest("[data-ofoto]")) return $("#o-file", p).click();
      if (e.target.closest("[data-ofotoweg]")){ fotoWeg(pt.fotoId); pt.fotoId = ""; tekenFoto(); return; }
      if (e.target.closest("[data-oweg]")){
        bevestig("Dit opleverpunt verwijderen?", "Ook de foto verdwijnt.").then(function(ja){
          if (!ja) return;
          if (pt.fotoId) fotoWeg(pt.fotoId);
          D.punten = D.punten.filter(function(x){ return x.id !== pt.id; });
          bewaar(); sluitPaneel(p); if (klaar) klaar(); toast("Verwijderd");
        });
        return;
      }
      if (e.target.closest("[data-osave]")){
        var aard = $("#o-aard", p).value.trim();
        if (!aard) return toast("Beschrijf wat er mis is");
        if (!$("#o-loc", p).value.trim()) return toast("Noteer waar precies — anders is het punt niet bruikbaar");
        pt.aard = aard;
        pt.ruimteId = $("#o-ruimte", p).value;
        pt.locatie = $("#o-loc", p).value.trim();
        pt.omvang = $("#o-omv", p).value.trim();
        pt.notitie = $("#o-not", p).value;
        if (nieuw) D.punten.push(pt);
        else D.punten = D.punten.map(function(x){ return x.id === pt.id ? pt : x; });
        bewaar(); sluitPaneel(p); if (klaar) klaar(); toast(nieuw ? "Vastgelegd" : "Opgeslagen");
      }
    });
    if (nieuw) setTimeout(function(){ $("#o-aard", p).focus(); }, 60);
  }

  /* ═══ weergave: nu ═══════════════════════════════════════ */
  /* Wat de app zelf opmerkt: posten die vrijwel iedereen vergeet. */
  function suggesties(){
    var uit = [];
    VERGETEN.forEach(function(v){
      var raak = D.items.some(function(it){
        var t = (it.naam + " " + (it.notitie||"")).toLowerCase();
        return v.woorden.some(function(w){ return t.indexOf(w) !== -1; });
      });
      if (!raak) uit.push(v);
    });
    return uit;
  }
  function maakVanSuggestie(naam, ruimteId){
    var v = VERGETEN.filter(function(x){ return x.naam === naam; })[0];
    openItem(null, ruimteId || D.laatsteRuimte || (D.ruimtes[0]||{}).id);
    setTimeout(function(){
      var inp = $("#i-naam", host.lastElementChild);
      if (inp){ inp.value = naam; inp.focus(); }
      var not = $("#i-notitie", host.lastElementChild);
      if (not && v) not.value = v.waarom;
    }, 80);
  }

  function tekenNu(){
    var el = $('[data-view="nu"]');
    var urgent = D.items.map(function(i){ return {it:i, u:urgentie(i)}; })
                        .filter(function(x){ return x.u; })
                        .sort(function(a,b){ return a.u.d - b.u.d; })
                        .map(function(x){ return x.it; });
    var keuzes = D.keuzes.map(function(k){ return {k:k, u:keuzeUrgentie(k)}; })
                         .filter(function(x){ return x.u && x.u.tone !== "ok"; })
                         .sort(function(a,b){ return a.u.d - b.u.d; });
    var loopt = D.items.filter(function(i){ return i.status === "ingepland" || i.status === "bezig"; });
    var geenDatum = D.items.filter(function(i){
      return !AF[i.status] && TEBESTELLEN[i.status] && (!i.nodig || !Number(i.leverWk));
    });
    var vergeten = suggesties();

    function blok(eyebrow, titel, lede, rows, leegtekst){
      return '<div><p class="eyebrow">' + eyebrow + '</p><h2 class="sec">' + titel + "</h2>" +
        (lede ? '<p class="lede">' + lede + "</p>" : "") +
        (rows.length ? '<div class="rows">' + rows.map(function(i){ return itemRij(i, true); }).join("") + "</div>"
                     : '<div class="empty" style="margin-top:11px">' + leegtekst + "</div>") + "</div>";
    }

    el.innerHTML = '<div class="stack">' +
      (!sleutel() ? '<div class="empty">Vul een opleverdatum in bij de instellingen — dan kan de app deadlines uitrekenen.</div>' : "") +

      (keuzes.length
        ? '<div><p class="eyebrow">Onherroepelijk</p><h2 class="sec">Koperskeuzes die sluiten</h2>' +
          '<p class="lede">Na de sluitingsdatum kan de aannemer niets meer wijzigen. Dit zijn de enige deadlines hier die nooit opschuiven.</p>' +
          '<div class="rows">' + keuzes.map(function(x){ return keuzeRij(x.k); }).join("") + "</div></div>"
        : "") +

      blok("Loopt af", "Dit kan niet wachten",
           "Berekend vanaf wanneer je het nodig hebt, min de levertijd.", urgent, "Niets urgent. Mooi.") +

      blok("Onderhanden", "Loopt nu", "", loopt, "Er staat niets ingepland of in uitvoering.") +

      (vergeten.length
        ? '<div><p class="eyebrow">Denk hieraan</p><h2 class="sec">Dit staat er nog niet in</h2>' +
          '<p class="lede">Posten die vrijwel iedereen vergeet te begroten. Tik erop om ze over te nemen — of negeer ze als je ze bewust niet doet.</p>' +
          '<div class="rows">' + vergeten.map(function(v){
              return '<button class="row acc" data-vergeten="' + esc(v.naam) + '" type="button">' +
                '<span class="mark" style="border-style:dashed"></span>' +
                '<span class="txt"><b>' + esc(v.naam) + "</b><span>" + esc(v.waar) + " · " + esc(v.waarom) + "</span></span>" +
                '<span class="right"><span class="pill acc">+</span></span></button>';
            }).join("") + "</div></div>"
        : "") +

      blok("Onbekend", "Nog geen deadline",
           "Zonder datum en levertijd kan de app hier niets over zeggen.", geenDatum, "Alles heeft een datum. Netjes.") +
      "</div>";
  }

  /* ═══ weergave: inkoop ═══════════════════════════════════ */
  function tekenInkoop(){
    var el = $('[data-view="inkoop"]');
    var perWinkel = {};
    D.items.forEach(function(it){
      if (!TEBESTELLEN[it.status]) return;
      var w = it.winkel || "Nog geen winkel";
      (perWinkel[w] = perWinkel[w] || []).push(it);
    });
    var blokken = Object.keys(perWinkel).sort().map(function(w){
      var list = perWinkel[w];
      var som = list.reduce(function(a,i){ return a + (Number(i.begroot)||0); }, 0);
      return '<div style="margin-top:16px"><div class="sectitle" style="padding:0 2px 4px">' +
        '<strong style="font-family:var(--display); font-size:15px; font-weight:600">' + esc(w) + "</strong>" +
        '<span class="money">' + list.length + " · " + kort(som) + "</span></div>" +
        '<div class="rows">' + list.map(function(i){ return itemRij(i, true); }).join("") + "</div></div>";
    }).join("");
    var klusjes = D.klusjes.map(function(k){
      return '<button class="row ' + (k.done ? "ok" : "") + '" data-klus="' + k.id + '" data-done="' +
        (k.done ? 1 : 0) + '" type="button"><span class="mark">' + CHECK +
        '</span><span class="txt"><b>' + esc(k.naam) + '</b></span><span class="right"></span></button>';
    }).join("");
    el.innerHTML = '<div class="stack">' +
      '<div><p class="eyebrow">Bestellen</p><h2 class="sec">De grote inkoop</h2>' +
      '<p class="lede">Alles wat nog gekozen of besteld moet worden, gegroepeerd per winkel.</p>' +
      (blokken || '<div class="empty" style="margin-top:11px">Niets te bestellen.</div>') + "</div>" +
      '<div><p class="eyebrow">Meenemen</p><h2 class="sec">Bouwmarktlijstje</h2>' +
      '<p class="lede">Kleine spullen. Snel erbij, afvinken in de winkel.</p>' +
      '<div style="display:flex; gap:7px; margin-top:12px">' +
      '<input id="k-add" type="text" placeholder="Kit, voorstrijk, 4× tl-buis…" autocomplete="off" ' +
      'style="flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-size:16px">' +
      '<button class="btn btn-primary" id="k-btn">Erbij</button></div>' +
      '<div class="rows">' + klusjes + "</div>" +
      (D.klusjes.some(function(k){ return k.done; })
        ? '<button class="btn btn-ghost btn-wide" id="k-opruim" style="margin-top:9px">Afgevinkte wissen</button>' : "") +
      "</div></div>";
  }

  /* ═══ ruimte-detail ══════════════════════════════════════ */
  function openRuimte(rid){
    var r = ruimteVan(rid); if (!r) return;
    r.maten = r.maten || {vloer:"", wand:"", omtrek:""};
    var html =
      '<div class="stack">' +
        '<div><div class="sectitle"><p class="eyebrow">Onderdelen</p>' +
        '<button class="btn btn-ghost" data-nieuw style="padding:4px 8px; font-size:13px">+ Toevoegen</button></div>' +
        '<div id="rd-items"></div></div>' +
        '<div><p class="eyebrow">Moodboard</p><h2 class="sec">Kleur, materiaal en foto’s</h2>' +
        '<p class="lede">Op het bord schuif je alles vrij naast elkaar, zodat je combinaties ziet vóór je bestelt.</p>' +
        '<div class="bordbalk"><div class="schakel" id="rd-schakel">' +
          '<button type="button" data-weergave="bord">Bord</button>' +
          '<button type="button" data-weergave="raster">Raster</button>' +
        '</div>' +
        '<button class="btn" data-foto-add style="padding:7px 12px; font-size:13px">+ Foto</button>' +
        '<button class="btn" data-staal-add style="padding:7px 12px; font-size:13px">+ Staal</button>' +
        '<button class="btn" data-notitie-add style="padding:7px 12px; font-size:13px">+ Notitie</button></div>' +
        '<div id="rd-board"></div>' +
        '<div class="tiles" id="rd-tiles" hidden></div>' +
        '<input type="file" id="rd-file" accept="image/*" hidden></div>' +
        '<div><p class="eyebrow">Links</p><h2 class="sec">Winkels en inspiratie</h2>' +
        '<div id="rd-links" style="margin-top:10px"></div>' +
        '<button class="btn btn-wide" data-link style="margin-top:6px">+ Link opslaan</button></div>' +
        '<div><p class="eyebrow">Maten</p><h2 class="sec">Hoeveel heb je nodig?</h2>' +
        '<p class="lede">Vul de maten in, dan reken ik de materialen uit die je meestal vergeet.</p>' +
        '<div class="duo" style="margin-top:12px">' +
          '<label class="field"><span>Vloer (m²)</span><input id="m-vloer" type="number" inputmode="decimal" min="0" step="0.1" value="' + esc(r.maten.vloer) + '"></label>' +
          '<label class="field"><span>Wand (m²)</span><input id="m-wand" type="number" inputmode="decimal" min="0" step="0.1" value="' + esc(r.maten.wand) + '"></label>' +
        "</div>" +
        '<label class="field"><span>Omtrek (m)</span><input id="m-omtrek" type="number" inputmode="decimal" min="0" step="0.1" value="' + esc(r.maten.omtrek) + '">' +
        '<span class="hint">Voor plinten en kimband. Laat leeg wat je niet weet.</span></label>' +
        '<div id="rd-mat"></div></div>' +
        '<div><button class="btn btn-danger btn-wide" data-verwijder>Ruimte verwijderen</button></div>' +
      "</div>";
    var p = openPaneel(r.naam, html, {
      actie: '<button class="iconbtn" data-hernoem aria-label="Naam wijzigen"><svg class="glyph" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/></svg></button>'
    });

    function tekenItems(){
      var list = itemsVan(rid);
      $("#rd-items", p).innerHTML = list.length
        ? '<div class="rows">' + list.map(function(i){ return itemRij(i); }).join("") + "</div>"
        : '<div class="empty" style="margin-top:11px">Nog niets in deze ruimte.</div>';
    }
    function tekenLinks(){
      r.links = r.links || [];
      $("#rd-links", p).innerHTML = r.links.length ? r.links.map(function(l){
        return '<div class="linkrow">' + EXT + '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
          esc(l.naam || l.url) + '</a><button class="iconbtn" data-linkweg="' + l.id + '" aria-label="Verwijderen">×</button></div>';
      }).join("") : '<p class="lede" style="margin:0">Nog geen links.</p>';
    }
    function tekenTiles(){
      var bd = beeldVan(rid);
      $("#rd-tiles", p).innerHTML = bd.length ? bd.map(function(b){
        var inhoud = b.soort === "staal"
          ? '<span class="swatch" style="background:' + esc(b.kleur) + '"></span>'
          : (b.soort === "notitie"
             ? '<span class="swatch" style="background:var(--warn-soft)"></span>'
             : '<img alt="' + esc(b.naam || "foto") + '" data-foto="' + b.id + '">');
        return '<div class="tile">' + inhoud +
          '<button class="del" data-beeldweg="' + b.id + '" aria-label="Verwijderen">×</button>' +
          (b.naam ? '<span class="cap">' + esc(b.naam) + "</span>" : "") + "</div>";
      }).join("") : '<div class="empty" style="grid-column:1/-1">Nog niets op het bord.</div>';
      bd.filter(function(b){ return b.soort === "foto"; }).forEach(function(b){
        fotoHaal(b.id).then(function(url){
          var img = $('[data-foto="' + b.id + '"]', p);
          if (img && url) img.src = url;
        });
      });
    }

    /* ── het bord ──────────────────────────────────────────
       Vaste virtuele maat van 600×900, geschaald naar de breedte
       van het scherm. Zo blijft een plek die je op je telefoon
       kiest ook op een laptop op dezelfde plek staan. */
    var BW = 600, BH = 900, TW = 150;
    function tekenBord(){
      var bd = beeldVan(rid);
      var wrap = $("#rd-board", p);
      /* Nieuwe tegels krijgen het eerstvolgende vrije vak, geteld vanaf
         wat er al ligt — anders stapelen ze allemaal op dezelfde plek. */
      var slot = bd.filter(function(b){ return b.x != null; }).length;
      var geplaatst = 0;
      bd.forEach(function(b){
        if (b.x == null){
          b.x = 20 + (slot % 3) * 190;
          b.y = 20 + Math.floor(slot / 3) * 200;
          if (b.y > BH - 170){ b.y = 20 + ((slot * 37) % 300); b.x = 20 + ((slot * 53) % 400); }
          slot++; geplaatst++;
        }
      });
      if (geplaatst) bewaar();
      wrap.innerHTML = '<div class="bordwrap" id="bw"><div class="bord" id="bd">' +
        (bd.length ? bd.map(function(b){
          var vlak = b.soort === "staal"
            ? '<span class="vlak" style="background:' + esc(b.kleur) + '"></span>'
            : (b.soort === "notitie" ? "" : '<img class="vlak" alt="" data-foto="' + b.id + '">');
          return '<div class="bt ' + (b.soort === "notitie" ? "notitie" : "") + '" data-bt="' + b.id +
            '" style="left:' + b.x + "px; top:" + b.y + 'px">' + vlak +
            (b.naam ? '<div class="bijs">' + esc(b.naam) + "</div>" : "") +
            '<button class="wis" data-beeldweg="' + b.id + '" aria-label="Verwijderen">×</button></div>';
        }).join("") : "") +
        "</div></div>" +
        (bd.length ? "" : '<div class="empty" style="margin-top:-1px; border-top:0; border-radius:0 0 var(--r) var(--r)">Voeg een foto, staal of notitie toe.</div>');
      bd.filter(function(b){ return b.soort === "foto"; }).forEach(function(b){
        fotoHaal(b.id).then(function(url){
          var img = $('.bt[data-bt="' + b.id + '"] img', p);
          if (img && url) img.src = url;
        });
      });
      schaalBord();
    }
    var schaal = 1;
    function schaalBord(){
      var bw = $("#bw", p), bord = $("#bd", p);
      if (!bw || !bord) return;
      schaal = bw.clientWidth / BW;
      bord.style.transform = "scale(" + schaal + ")";
      bw.style.height = (BH * schaal) + "px";
    }
    window.addEventListener("resize", schaalBord);

    /* slepen */
    var pak = null;
    $("#rd-board", p).addEventListener("pointerdown", function(e){
      var t = e.target.closest(".bt");
      if (!t || e.target.closest(".wis")) return;
      var b = D.beeld.filter(function(x){ return x.id === t.dataset.bt; })[0];
      if (!b) return;
      pak = {el:t, b:b, dx:e.clientX/schaal - b.x, dy:e.clientY/schaal - b.y, bewogen:false};
      t.classList.add("pak");
      t.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    $("#rd-board", p).addEventListener("pointermove", function(e){
      if (!pak) return;
      var nx = Math.max(0, Math.min(BW - TW, Math.round((e.clientX/schaal - pak.dx)/5)*5));
      var ny = Math.max(0, Math.min(BH - 60, Math.round((e.clientY/schaal - pak.dy)/5)*5));
      if (nx !== pak.b.x || ny !== pak.b.y) pak.bewogen = true;
      pak.b.x = nx; pak.b.y = ny;
      pak.el.style.left = nx + "px";
      pak.el.style.top = ny + "px";
    });
    function los(){
      if (!pak) return;
      pak.el.classList.remove("pak");
      if (pak.bewogen) bewaar();
      pak = null;
    }
    $("#rd-board", p).addEventListener("pointerup", los);
    $("#rd-board", p).addEventListener("pointercancel", los);

    function zetWeergave(w){
      r.weergave = w; bewaar();
      $("#rd-board", p).hidden = (w !== "bord");
      $("#rd-tiles", p).hidden = (w !== "raster");
      $$("[data-weergave]", p).forEach(function(b){
        b.setAttribute("aria-pressed", String(b.dataset.weergave === w));
      });
      if (w === "bord") schaalBord();
    }
    function tekenMat(){
      var v = Number($("#m-vloer", p).value) || 0;
      var w = Number($("#m-wand", p).value) || 0;
      var o = Number($("#m-omtrek", p).value) || 0;
      var bron = {vloer:v, wand:w, plafond:v, omtrek:o};
      var rijen = MATERIAAL.filter(function(m){ return bron[m[0]] > 0; }).map(function(m){
        var hoeveel = bron[m[0]] * m[1];
        var afgerond = hoeveel < 10 ? Math.round(hoeveel*10)/10 : Math.ceil(hoeveel);
        return "<tr><td>" + esc(m[2]) + '<span class="sub">' + esc(m[4]) + "</span></td>" +
          "<td>" + afgerond.toLocaleString("nl-NL") + " " + m[3] + "</td></tr>";
      }).join("");
      $("#rd-mat", p).innerHTML = rijen
        ? '<table class="mtab"><thead><tr><th>Materiaal</th><th style="text-align:right">Schatting</th></tr></thead><tbody>' +
          rijen + "</tbody></table>" +
          '<p class="lede" style="font-size:12.5px">Richtgetallen om mee naar de bouwmarkt te gaan. Het etiket van het product wint altijd.</p>'
        : '<div class="empty">Vul minstens één maat in.</div>';
    }
    tekenItems(); tekenLinks(); tekenTiles(); tekenBord(); tekenMat();
    zetWeergave(r.weergave || "bord");

    p.addEventListener("input", function(e){
      if (/^m-(vloer|wand|omtrek)$/.test(e.target.id)){
        r.maten.vloer = $("#m-vloer", p).value;
        r.maten.wand = $("#m-wand", p).value;
        r.maten.omtrek = $("#m-omtrek", p).value;
        bewaar(); tekenMat();
      }
    });
    p.addEventListener("click", function(e){
      var t = e.target;
      if (t.closest("[data-nieuw]")) return openItem(null, rid);
      var rij = t.closest("[data-item]");
      if (rij) return openItem(rij.dataset.item);
      if (t.closest("[data-hernoem]")){
        sheet({titel:"Naam van de ruimte", ja:"Opslaan",
               velden:[{id:"naam", label:"Naam", waarde:r.naam}]}).then(function(res){
          if (!res || !res.naam.trim()) return;
          r.naam = res.naam.trim(); bewaar(); $("h2", p).textContent = r.naam;
        });
        return;
      }
      if (t.closest("[data-verwijder]")){
        var aantal = itemsVan(rid).length, bd = beeldVan(rid).length;
        var gevolg = [];
        if (aantal) gevolg.push(aantal === 1 ? "1 onderdeel" : aantal + " onderdelen");
        if (bd) gevolg.push(bd === 1 ? "1 afbeelding" : bd + " afbeeldingen");
        bevestig("“" + r.naam + "” verwijderen?",
                 gevolg.length ? "Ook " + gevolg.join(" en ") + " verdwijnen. Dit kan niet ongedaan gemaakt worden."
                               : "Dit kan niet ongedaan gemaakt worden.")
          .then(function(ja){
            if (!ja) return;
            D.items = D.items.filter(function(i){ return i.ruimteId !== rid; });
            beeldVan(rid).forEach(function(b){ if (b.soort !== "staal") fotoWeg(b.id); });
            D.beeld = D.beeld.filter(function(b){ return b.ruimteId !== rid; });
            D.ruimtes = D.ruimtes.filter(function(x){ return x.id !== rid; });
            bewaar(); sluitPaneel(p); toast("Ruimte verwijderd");
          });
        return;
      }
      if (t.closest("[data-link]")){
        vraagLink().then(function(l){
          if (!l) return;
          r.links = r.links || []; r.links.push(l);
          bewaar(); tekenLinks(); toast("Link opgeslagen");
        });
        return;
      }
      var lw = t.closest("[data-linkweg]");
      if (lw){
        r.links = (r.links||[]).filter(function(l){ return l.id !== lw.dataset.linkweg; });
        bewaar(); tekenLinks(); return;
      }
      var wv = t.closest("[data-weergave]");
      if (wv) return zetWeergave(wv.dataset.weergave);
      if (t.closest("[data-foto-add]")) return $("#rd-file", p).click();
      if (t.closest("[data-staal-add]")){
        sheet({titel:"Kleur of materiaal", ja:"Toevoegen",
               uitleg:"Kies de kleur zelf, of plak een hexcode uit de webshop.",
               velden:[{id:"naam", label:"Wat is het?", plaats:"Eiken naturel · RAL 9010 · voegkleur grijs"},
                       {id:"kleur", label:"Kleur", type:"kleur", waarde:STALEN[D.beeld.length % STALEN.length]}]})
          .then(function(res){
            if (!res) return;
            D.beeld.push({id:uid(), ruimteId:rid, soort:"staal",
                          naam:res.naam.trim(), kleur:res.kleur});
            bewaar(); tekenTiles(); tekenBord();
          });
        return;
      }
      if (t.closest("[data-notitie-add]")){
        sheet({titel:"Notitie op het bord", ja:"Toevoegen",
               uitleg:"Handig voor maten, voegkleuren of iets wat je niet wil vergeten.",
               velden:[{id:"tekst", label:"Tekst", plaats:"Voegkleur grijs · tegel 60×60 · legpatroon halfsteens"}]})
          .then(function(res){
            if (!res || !res.tekst.trim()) return;
            D.beeld.push({id:uid(), ruimteId:rid, soort:"notitie", naam:res.tekst.trim()});
            bewaar(); tekenTiles(); tekenBord();
          });
        return;
      }
      var bw = t.closest("[data-beeldweg]");
      if (bw){
        var bid = bw.dataset.beeldweg;
        var b = D.beeld.filter(function(x){ return x.id === bid; })[0];
        if (b && b.soort === "foto") fotoWeg(bid);
        D.beeld = D.beeld.filter(function(x){ return x.id !== bid; });
        bewaar(); tekenTiles(); tekenBord(); return;
      }
    });
    $("#rd-file", p).addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0]; if (!f) return;
      e.target.value = "";
      verkleinFoto(f).then(function(url){
        var id = uid();
        return fotoZet(id, url).then(function(){
          return sheet({titel:"Bijschrift", ja:"Toevoegen",
                        uitleg:"Waar kijk je naar? Mag ook leeg blijven.",
                        velden:[{id:"naam", label:"Bijschrift", plaats:"Vloertegel 60×60, zandkleur"}]});
        }).then(function(res){
          D.beeld.push({id:id, ruimteId:rid, soort:"foto", naam:res ? res.naam.trim() : ""});
          bewaar(); tekenTiles(); tekenBord(); toast("Foto toegevoegd");
        });
      }).catch(function(){ toast("Die foto lukte niet"); });
    });
  }

  function verkleinFoto(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function(){
        var img = new Image();
        img.onerror = rej;
        img.onload = function(){
          var s = Math.min(1, 1280/Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.72));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

        '<option value="">— geen werkwijze —</option>' +
        Object.keys(KLUSWIJZERS).map(function(k){
          return '<option value="' + k + '"' + (it.kluswijzer === k ? " selected" : "") + ">" + esc(KLUSWIJZERS[k].naam) + "</option>";
