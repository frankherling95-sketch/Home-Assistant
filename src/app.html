        (nieuw ? "" : '<button class="btn btn-danger" data-weg>Verwijderen</button>') + "</div>";

    var p = openPaneel(nieuw ? "Nieuw onderdeel" : it.naam, html);

    function tekenStatus(){
      $("#i-status", p).innerHTML = STATUS[it.soort].map(function(s){
        return '<button type="button" data-st="' + s + '" aria-pressed="' + (it.status === s) + '">' + LABEL[s] + "</button>";
      }).join("");
    }
    function tekenFaseHint(){
      var v = $("#i-fase", p).value;
      $("#i-fasehint", p).textContent = v === "" ? "Bepaalt waar het op het Stappen-scherm terechtkomt." : FASES[Number(v)][1];
    }
    function tekenBestel(){
      var el = $("#i-bestel", p);
      var nodig = $("#i-nodig", p).value, lever = Number($("#i-lever", p).value) || 0;
      if (!nodig){
        el.innerHTML = '<span class="hint">Vul een datum in bij “Nodig op” om de uiterste besteldatum te berekenen.</span>';
        return;
      }
      var b = new Date(nodig + "T12:00:00");
      b.setDate(b.getDate() - lever*7);
      var dg = dagenTot(b);
      var kleur = dg < 0 ? "crit" : (dg <= 45 ? "warn" : "ok");
      var wk = datumNaarWeek(nodig);
      el.innerHTML = "<span>Uiterste besteldatum</span>" +
        '<div class="linkrow" style="margin:0"><b style="flex:1; font-family:var(--mono); font-size:14px">' + fmt(b) + "</b>" +
        '<span class="pill ' + kleur + '">' + (dg < 0 ? Math.abs(dg) + " dgn te laat" : "nog " + dg + " dgn") + "</span></div>" +
        '<span class="hint">' + (wk == null
          ? "Vul een sleuteldatum in bij de instellingen om dit in weken te zien."
          : "Dat is week " + (wk >= 0 ? "+" : "") + wk + " ten opzichte van de sleutel.") + "</span>";
    }
    function tekenILinks(){
      $("#i-links", p).innerHTML = it.links.length ? it.links.map(function(l){
        return '<div class="linkrow">' + EXT + '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
          esc(l.naam || l.url) + '</a><button class="iconbtn" data-ilinkweg="' + l.id + '" aria-label="Verwijderen">×</button></div>';
      }).join("") : '<span class="hint">Nog geen links.</span>';
    }
    function materiaalLijst(kw){
      var r = ruimteVan($("#i-ruimte", p).value) || {};
      var m = r.maten || {};
      var bron = {vloer:Number(m.vloer)||0, wand:Number(m.wand)||0,
                  omtrek:Number(m.omtrek)||0, vast:1};
      return kw.materiaal.map(function(x){
        var basis = bron[x.per] || 0;
        if (x.per !== "vast" && basis === 0) return {naam:x.naam, tekst:"maat onbekend", leeg:true};
        var n = basis * x.factor;
        var afg = n < 10 ? Math.round(n*10)/10 : Math.ceil(n);
        return {naam:x.naam, tekst:afg.toLocaleString("nl-NL") + " " + x.eenheid};
      });
    }
    function tekenKW(){
      var sleutelKW = $("#i-kw", p).value;
      var el = $("#i-kwblok", p);
      if (!sleutelKW){ el.innerHTML = ""; return; }
      var kw = KLUSWIJZERS[sleutelKW];
      var lijst = materiaalLijst(kw);
      var mist = lijst.some(function(x){ return x.leeg; });
      el.innerHTML =
        '<div class="field"><span>Zo pak je het aan</span>' +
        '<ol class="werkwijze">' + kw.stappen.map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
        (kw.let ? '<div class="fase"><div class="body" style="padding:0"><div class="dep">' + esc(kw.let) + "</div></div></div>" : "") +
        '</div><div class="field"><span>Wat je nodig hebt</span>' +
        '<table class="mtab"><tbody>' + lijst.map(function(x){
          return "<tr><td>" + esc(x.naam) + '</td><td' + (x.leeg ? ' style="color:var(--ink-3)"' : "") + ">" + esc(x.tekst) + "</td></tr>";
        }).join("") + "</tbody></table>" +
        (mist ? '<span class="hint">Vul de maten van deze ruimte in om de hoeveelheden te berekenen.</span>' : "") +
        '<button class="btn btn-wide" data-naarlijst style="margin-top:10px">Zet op mijn bouwmarktlijstje</button>' +
        '<span class="hint">Richtgetallen. Het etiket van het product wint altijd.</span></div>';
    }
    it.opties = it.opties || [];
    function tekenOpties(){
      var el = $("#i-opties", p);
      el.innerHTML = it.opties.map(function(o){
        var vlak = o.fotoId
          ? '<img class="beeldvlak" alt="" data-ofoto="' + o.id + '">'
          : '<span class="leeg" data-optiefoto="' + o.id + '">foto toevoegen</span>';
        return '<div class="optie ' + (o.gekozen ? "gekozen" : "") + '" data-optie="' + o.id + '">' + vlak +
          '<div class="inhoud"><b>' + esc(o.naam || "Naamloos") + "</b>" +
          (Number(o.prijs) ? '<span class="pr">' + euro(o.prijs) + "</span>" : "") +
          (o.winkel ? '<span class="nt">' + esc(o.winkel) + "</span>" : "") +
          (o.notitie ? '<span class="nt">' + esc(o.notitie) + "</span>" : "") +
          (o.url ? '<a class="chip" href="' + esc(o.url) + '" target="_blank" rel="noopener noreferrer" style="align-self:flex-start">bekijk</a>' : "") +
          '<div class="acties"><button type="button" data-obewerk="' + o.id + '">Wijzig</button>' +
          '<button type="button" class="kies" data-okies="' + o.id + '">' + (o.gekozen ? "Gekozen" : "Kies") + "</button>" +
          "</div></div></div>";
      }).join("") +
        '<button class="optie nieuw" data-onieuw type="button"><span style="text-align:center">' +
        '<span style="font-family:var(--mono); font-size:22px; display:block">+</span>' +
        '<small style="font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em">optie</small></span></button>';
      it.opties.filter(function(o){ return o.fotoId; }).forEach(function(o){
        fotoHaal(o.fotoId).then(function(u){
          var i = $('[data-ofoto="' + o.id + '"]', p);
          if (i && u) i.src = u;
        });
      });
    }
    function bewerkOptie(o){
      return sheet({
        titel:o.naam ? "Optie wijzigen" : "Optie toevoegen", ja:"Opslaan",
        velden:[{id:"naam", label:"Wat is het?", waarde:o.naam || "", plaats:"Eiken visgraat 14 cm"},
                {id:"prijs", label:"Prijs (€)", type:"number", waarde:Number(o.prijs) || ""},
                {id:"winkel", label:"Winkel", waarde:o.winkel || "", plaats:"Vloerenwinkel"},
                {id:"url", label:"Link", type:"url", waarde:o.url || "", plaats:"gamma.nl/..."},
                {id:"notitie", label:"Waarom wel of niet", waarde:o.notitie || "", plaats:"Mooiste kleur, wel duurder"}]
      }).then(function(res){
        if (!res) return false;
        o.naam = res.naam.trim();
        o.prijs = klem(res.prijs, 0, 9999999);
        o.winkel = res.winkel.trim();
        o.notitie = res.notitie.trim();
        var u = res.url.trim();
        o.url = u ? (/^https?:\/\//i.test(u) ? u : "https://" + u) : "";
        return true;
      });
    }
    var optieVoorFoto = null;
    $("#i-optiefoto", p).addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f || !optieVoorFoto) return;
      var o = optieVoorFoto; optieVoorFoto = null;
      verkleinFoto(f).then(function(u){
        var fid = uid();
        return fotoZet(fid, u).then(function(){ o.fotoId = fid; tekenOpties(); });
      }).catch(function(){ toast("Die foto lukte niet"); });
    });

    tekenStatus(); tekenFaseHint(); tekenBestel(); tekenILinks(); tekenKW(); tekenOpties();

    p.addEventListener("input", function(e){
      if (e.target.id === "i-nodig" || e.target.id === "i-lever") tekenBestel();
    });
    p.addEventListener("change", function(e){
      if (e.target.id === "i-fase") tekenFaseHint();
      if (e.target.id === "i-kw" || e.target.id === "i-ruimte") tekenKW();
    });
    p.addEventListener("click", function(e){
      var s = e.target.closest("[data-s]");
      if (s){
        it.soort = s.dataset.s;
        if (STATUS[it.soort].indexOf(it.status) === -1) it.status = STATUS[it.soort][0];
        $$("[data-s]", p).forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.s === it.soort)); });
        tekenStatus(); return;
      }
      var st = e.target.closest("[data-st]");
      if (st){
        it.status = st.dataset.st;
        $$("[data-st]", p).forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.st === it.status)); });
        return;
      }
      if (e.target.closest("[data-onieuw]")){
        var o = {id:uid(), naam:"", prijs:0, winkel:"", url:"", notitie:"", fotoId:"", gekozen:false};
        bewerkOptie(o).then(function(ok){ if (ok){ it.opties.push(o); tekenOpties(); } });
        return;
      }
      var ob = e.target.closest("[data-obewerk]");
      if (ob){
        var oo = it.opties.filter(function(x){ return x.id === ob.dataset.obewerk; })[0];
        if (oo) bewerkOptie(oo).then(function(ok){ if (ok) tekenOpties(); });
        return;
      }
      var of = e.target.closest("[data-optiefoto]");
      if (of){
        optieVoorFoto = it.opties.filter(function(x){ return x.id === of.dataset.optiefoto; })[0];
        $("#i-optiefoto", p).click();
        return;
      }
      var ok2 = e.target.closest("[data-okies]");
      if (ok2){
        var gek = it.opties.filter(function(x){ return x.id === ok2.dataset.okies; })[0];
        if (!gek) return;
        var aanUit = !gek.gekozen;
        it.opties.forEach(function(x){ x.gekozen = false; });
        gek.gekozen = aanUit;
        if (aanUit){
          if (Number(gek.prijs)) $("#i-begroot", p).value = gek.prijs;
          if (gek.winkel) $("#i-winkel", p).value = gek.winkel;
          if (gek.url && !it.links.some(function(l){ return l.url === gek.url; })){
            it.links.push({id:uid(), naam:gek.naam || gek.winkel || "Gekozen optie", url:gek.url});
            tekenILinks();
          }
          if (it.status === "tekiezen"){
            it.status = "gekozen";
            $$("[data-st]", p).forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.st === it.status)); });
          }
          toast("Gekozen — prijs en winkel overgenomen");
        }
        tekenOpties();
        return;
      }
      if (e.target.closest("[data-naarlijst]")){
        var kw = KLUSWIJZERS[$("#i-kw", p).value];
        if (!kw) return;
        var bestaand = D.klusjes.map(function(k){ return k.naam.toLowerCase(); });
        var toe = 0;
        materiaalLijst(kw).forEach(function(x){
          var regel = x.naam + (x.leeg ? "" : " — " + x.tekst);
          if (bestaand.indexOf(regel.toLowerCase()) !== -1) return;
          D.klusjes.push({id:uid(), naam:regel, done:false}); toe++;
        });
        bewaar();
        toast(toe ? toe + " regels op je lijstje gezet" : "Stond er al op");
        return;
      }
      if (e.target.closest("[data-ilink]")){
        vraagLink().then(function(l){ if (l){ it.links.push(l); tekenILinks(); } });
        return;
      }
      var lw = e.target.closest("[data-ilinkweg]");
      if (lw){ it.links = it.links.filter(function(l){ return l.id !== lw.dataset.ilinkweg; }); tekenILinks(); return; }
      if (e.target.closest("[data-weg]")){
        bevestig("“" + (it.naam || "Dit onderdeel") + "” verwijderen?", "Dit kan niet ongedaan gemaakt worden.")
          .then(function(ja){
            if (!ja) return;
            D.items = D.items.filter(function(x){ return x.id !== it.id; });
            bewaar(); sluitPaneel(p); toast("Verwijderd");
          });
        return;
      }
      if (e.target.closest("[data-opslaan]")){
        var naam2 = $("#i-naam", p).value.trim();
        if (!naam2) return toast("Geef het een naam");
        var fv = $("#i-fase", p).value;
        it.naam = naam2;
        it.ruimteId = $("#i-ruimte", p).value;
        it.fase = fv === "" ? null : Number(fv);
        it.afmetingen = $("#i-afm", p).value.trim();
        it.winkel = $("#i-winkel", p).value.trim();
        it.artikelnr = $("#i-art", p).value.trim();
        it.begroot = klem($("#i-begroot", p).value, 0, 9999999);
        it.betaald = klem($("#i-betaald", p).value, 0, 9999999);
        it.leverWk = klem($("#i-lever", p).value, 0, 99);
        it.nodig = $("#i-nodig", p).value || "";
        it.notitie = $("#i-notitie", p).value;
        it.kluswijzer = $("#i-kw", p).value || "";
        it.gewijzigd = Date.now();
        /* Foto's van opties die zijn weggegooid ook uit de opslag halen. */
        if (!nieuw){
          var oudeFotos = (bron.opties || []).map(function(o){ return o.fotoId; }).filter(Boolean);
          var nieuweFotos = it.opties.map(function(o){ return o.fotoId; }).filter(Boolean);
          oudeFotos.forEach(function(f){ if (nieuweFotos.indexOf(f) === -1) fotoWeg(f); });
        }
        D.laatsteRuimte = it.ruimteId;
        if (nieuw) D.items.push(it);
        else D.items = D.items.map(function(x){ return x.id === it.id ? it : x; });
        bewaar(); sluitPaneel(p); toast(nieuw ? "Toegevoegd" : "Opgeslagen");
        return;
      }
    });
    if (nieuw) setTimeout(function(){ $("#i-naam", p).focus(); }, 60);
  }

  /* ═══ zoeken ═════════════════════════════════════════════ */
  function openZoek(){
    var p = openPaneel("Zoeken",
      '<input id="z-in" type="search" placeholder="Onderdeel, winkel, artikelnummer…" autocomplete="off" ' +
      'style="width:100%; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:13px 14px; font-size:16px">' +
      '<div id="z-uit" style="margin-top:14px"></div>');
    var inp = $("#z-in", p), uit = $("#z-uit", p);
    function zoek(){
      var t = inp.value.trim().toLowerCase();
      if (!t){
        uit.innerHTML = '<p class="lede">Handig als je in de winkel staat: typ een deel van de naam, de winkel of het artikelnummer.</p>';
        return;
      }
      var hits = D.items.filter(function(i){
        var r = ruimteVan(i.ruimteId);
        return [i.naam, i.winkel, i.artikelnr, i.afmetingen, i.notitie, r ? r.naam : ""]
          .join(" ").toLowerCase().indexOf(t) !== -1;
      });
      uit.innerHTML = '<p class="lede">' + hits.length + (hits.length === 1 ? " resultaat" : " resultaten") + "</p>" +
        (hits.length ? '<div class="rows">' + hits.map(function(i){ return itemRij(i, true); }).join("") + "</div>" : "");
    }
    inp.addEventListener("input", zoek);
    p.addEventListener("click", function(e){
      var ri = e.target.closest("[data-item]");
      if (ri) openItem(ri.dataset.item);
    });
    zoek();
    setTimeout(function(){ inp.focus(); }, 60);
  }

  /* ═══ reservekopie ═══════════════════════════════════════
     Op claude.ai mag een pagina niet zelf een bestand aanbieden;
     daar gaat het via de download-toestemming van de viewer.
     Op GitHub Pages en op je eigen domein werkt de gewone link.
  ═════════════════════════════════════════════════════════ */
  function exporteer(){
    var tekst = JSON.stringify(D, null, 2);
    var naam = "staartploeg-" + iso(vandaag()) + ".json";
    function viaLink(){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([tekst], {type:"application/json"}));
      a.download = naam;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      toast("Reservekopie gemaakt");
    }
    if (!(window.claude && typeof window.claude.use === "function")) return viaLink();
    window.claude.use("downloads").then(function(dl){
      if (!dl) return viaLink();
      return dl.save({filename:naam, data:tekst}).then(
        function(){ toast("Reservekopie opgeslagen"); },
        function(err){
          if (err && err.code === "declined") return toast("Geannuleerd");
          if (err && (err.code === "unavailable" || err.code === "not_granted")) return viaLink();
          toast("Opslaan lukte niet — probeer het opnieuw");
        });
    }).catch(viaLink);
  }

  /* ═══ instellingen ═══════════════════════════════════════ */
  function openInstellingen(){
    var html =
      '<label class="field"><span>Projectnaam</span><input id="p-naam" type="text" value="' + esc(D.project.naam) + '"></label>' +
      '<label class="field"><span>Sleuteldatum</span><input id="p-datum" type="date" value="' + esc(D.project.sleutel) + '">' +
      '<span class="hint">Alle deadlines rekenen hiervandaan. Schuift de oplevering, pas dit dan aan — de hele planning schuift mee.</span></label>' +
      '<div class="duo">' +
        '<label class="field"><span>Budget (€)</span><input id="p-budget" type="number" inputmode="numeric" min="0" step="500" value="' + (Number(D.project.budget)||"") + '"></label>' +
        '<label class="field"><span>Buffer (%)</span><input id="p-buffer" type="number" inputmode="numeric" min="0" max="50" step="1" value="' + (Number(D.project.buffer)||0) + '"></label>' +
      "</div>" +
      '<p class="lede" style="margin:-6px 0 16px; font-size:12.5px">De buffer wordt van je budget afgetrokken voordat de app zegt hoeveel je te besteden hebt. Schuivende opleverdata leiden tot spoedleveringen tegen hogere prijzen — daar wil je ruimte voor houden.</p>' +
      '<button class="btn btn-primary btn-wide" data-psave style="padding:13px">Opslaan</button>' +
      '<hr class="hr"><div class="sectitle"><p class="eyebrow">Ruimtes</p>' +
      '<button class="btn btn-ghost" data-rnieuw style="padding:4px 8px; font-size:13px">+ Ruimte</button></div>' +
      '<div id="p-ruimtes" class="rows"></div>' +
      '<hr class="hr"><p class="eyebrow">Gegevens</p>' +
      '<p class="lede" style="margin-bottom:12px">De gegevens staan nu alleen op dit apparaat. Maak af en toe een reservekopie — dit is straks ook het bestand waarmee we naar een gedeelde versie voor jullie samen verhuizen.</p>' +
      '<div class="btn-row"><button class="btn" data-export>Reservekopie opslaan</button>' +
      '<button class="btn" data-import>Terugzetten</button></div>' +
      '<input type="file" id="p-file" accept="application/json" hidden>';
    var p = openPaneel("Instellingen", html);

    function tekenR(){
      $("#p-ruimtes", p).innerHTML = D.ruimtes.map(function(r){
        return '<div class="row" style="cursor:default"><span class="txt" style="grid-column:1/3"><b>' + esc(r.naam) + "</b>" +
          "<span>" + itemsVan(r.id).length + " onderdelen</span></span>" +
          '<span class="right"><button class="iconbtn" data-rweg="' + r.id + '" aria-label="Verwijderen">×</button></span></div>';
      }).join("") || '<div class="empty">Nog geen ruimtes.</div>';
    }
    tekenR();

    p.addEventListener("click", function(e){
      if (e.target.closest("[data-psave]")){
        var oud = D.project.sleutel, nieuw2 = $("#p-datum", p).value;
        D.project.naam = $("#p-naam", p).value.trim() || "Mijn woning";
        D.project.sleutel = nieuw2;
        D.project.budget = klem($("#p-budget", p).value, 0, 99999999);
        D.project.buffer = klem($("#p-buffer", p).value, 0, 50);
        var metDatum = D.items.filter(function(i){ return i.nodig; }).length;
        var delta = 0;
        if (oud && nieuw2 && oud !== nieuw2){
          delta = Math.round((new Date(nieuw2 + "T12:00:00") - new Date(oud + "T12:00:00")) / 86400000);
        }
        if (delta && metDatum){
          var wk = Math.abs(Math.round(delta/7));
          var weken = wk === 1 ? "een week" : wk + " weken";
          var richting = delta > 0 ? "later" : "eerder";
          var stuks = metDatum === 1 ? "het onderdeel dat" : "de " + metDatum + " onderdelen die";
          bevestig("Alle deadlines meeschuiven?",
                   "De sleutel ligt " + weken + " " + richting + ". Wil je " + stuks +
                   " een datum " + (metDatum === 1 ? "heeft" : "hebben") + " evenveel mee laten schuiven?",
                   "Ja, meeschuiven")
            .then(function(ja){
              if (ja) schuifDatums(delta);
              bewaar(); tekenKop();
              toast(ja ? "Alles " + weken + " " + richting + " gezet" : "Opgeslagen");
            });
          return;
        }
        bewaar(); toast("Opgeslagen"); tekenKop(); return;
      }
      if (e.target.closest("[data-rnieuw]")){
        sheet({titel:"Ruimte toevoegen", ja:"Toevoegen",
               velden:[{id:"naam", label:"Naam", plaats:"Werkkamer"}]}).then(function(res){
          if (!res || !res.naam.trim()) return;
          D.ruimtes.push({id:uid(), naam:res.naam.trim(), volgorde:D.ruimtes.length});
          bewaar(); tekenR();
        });
        return;
      }
      var rw = e.target.closest("[data-rweg]");
      if (rw){
        var rid = rw.dataset.rweg, r = ruimteVan(rid), aantal = itemsVan(rid).length;
        bevestig("“" + r.naam + "” verwijderen?",
                 aantal ? "Ook " + aantal + (aantal === 1 ? " onderdeel verdwijnt" : " onderdelen verdwijnen") + "."
                        : "Dit kan niet ongedaan gemaakt worden.")
          .then(function(ja){
            if (!ja) return;
            D.items = D.items.filter(function(i){ return i.ruimteId !== rid; });
            beeldVan(rid).forEach(function(b){ if (b.soort !== "staal") fotoWeg(b.id); });
            D.beeld = D.beeld.filter(function(b){ return b.ruimteId !== rid; });
            D.ruimtes = D.ruimtes.filter(function(x){ return x.id !== rid; });
            bewaar(); tekenR();
          });
        return;
      }
      if (e.target.closest("[data-export]")) return exporteer();
      if (e.target.closest("[data-import]")) return $("#p-file", p).click();
    });
    $("#p-file", p).addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        var n;
        try {
          n = JSON.parse(fr.result);
          if (!n || !n.versie) throw new Error("bad");
        } catch(err){ return toast("Dat bestand kon ik niet lezen"); }
        bevestig("Alles vervangen?",
                 "Wat er nu in de app staat wordt overschreven door " +
                 (n.items || []).length + " onderdelen uit dit bestand.", "Ja, terugzetten")
          .then(function(ja){
            if (!ja) return;
            D = n; bewaar(); sluitAlle(); tekenAlles(); toast("Teruggezet");
          });
      };
      fr.readAsText(f);
    });
  }

  /* ═══ tekenen ════════════════════════════════════════════ */
  function tekenKop(){
    $("#projectnaam").innerHTML = esc(D.project.naam || "Staartploeg") + '<span class="dot">.</span>';
    var s = sleutel();
    if (s){
      var wk = Math.round((s - vandaag())/(7*86400000));
      $("#s-weken").textContent = Math.abs(wk);
      $("#s-weken-l").textContent = wk >= 0 ? "weken tot sleutel" : "weken sinds sleutel";
    } else {
      $("#s-weken").textContent = "—"; $("#s-weken-l").textContent = "geen datum";
    }
    $("#s-actie").textContent =
      D.items.filter(function(i){ return urgentie(i); }).length +
      D.keuzes.filter(function(k){ var u = keuzeUrgentie(k); return u && (u.tone === "crit" || u.tone === "warn"); }).length;
    var begroot = D.items.reduce(function(a,i){ return a + (Number(i.begroot)||0); }, 0) +
                  D.keuzes.filter(function(k){ return k.status === "besteld"; })
                          .reduce(function(a,k){ return a + (Number(k.prijs)||0); }, 0);
    if (D.project.budget){
      var beschikbaar = D.project.budget * (1 - (Number(D.project.buffer)||0)/100);
      var pct = Math.round(begroot / beschikbaar * 100);
      $("#s-geld").textContent = pct + "%";
      $("#s-geld").style.color = pct > 100 ? "var(--crit)" : (pct > 85 ? "var(--warn)" : "");
      $("#s-geld-l").textContent = "van " + kort(Math.round(beschikbaar)) +
        (D.project.buffer ? " na buffer" : "");
    } else {
      $("#s-geld").textContent = kort(begroot);
      $("#s-geld").style.color = "";
      $("#s-geld-l").textContent = "begroot";
    }
  }
  var actief = "ruimtes";
  function tekenAlles(){
    tekenKop();
    if (actief === "ruimtes") tekenRuimtes();
    else if (actief === "stappen") tekenStappen();
    else if (actief === "nu") tekenNu();
    else tekenInkoop();
  }
  function ga(pane){
    var b = $('.nav button[data-pane="' + pane + '"]');
    if (b) b.click();
  }

  /* ═══ gebeurtenissen ═════════════════════════════════════ */
  $$(".nav button").forEach(function(b){
    b.addEventListener("click", function(){
      actief = b.dataset.pane;
      $$(".nav button").forEach(function(o){ o.setAttribute("aria-selected", String(o === b)); });
      $$("[data-view]").forEach(function(v){ v.hidden = v.dataset.view !== actief; });
      tekenAlles();
      window.scrollTo({top:0, behavior:"instant"});
    });
  });
  $("#fab").addEventListener("click", function(){
    if (!D.ruimtes.length) return toast("Voeg eerst een ruimte toe");
    openItem(null, null);
  });
  $("#btn-meer").addEventListener("click", openInstellingen);
  $("#btn-zoek").addEventListener("click", openZoek);
  $(".hdrstats").addEventListener("click", function(e){
    var s = e.target.closest(".stat"); if (s && s.dataset.ga) ga(s.dataset.ga);
  });

  document.addEventListener("click", function(e){
    if (host.children.length) return;
    if (e.target.closest("[data-open-tabel]")) return openTabel();
    if (e.target.closest("[data-open-keuzes]")) return openKeuzes();
    if (e.target.closest("[data-open-oplever]")) return openOplever();
    var kz = e.target.closest("[data-keuze]");
    if (kz) return bewerkKeuze(kz.dataset.keuze);
    var vg = e.target.closest("[data-vergeten]");
    if (vg) return maakVanSuggestie(vg.dataset.vergeten, vg.dataset.ruimte);
    var rc = e.target.closest("[data-ruimte]");
    if (rc) return openRuimte(rc.dataset.ruimte);
    var ri = e.target.closest("[data-item]");
    if (ri) return openItem(ri.dataset.item);
    var kb = e.target.closest("[data-klus]");
    if (kb){
      var k = D.klusjes.filter(function(x){ return x.id === kb.dataset.klus; })[0];
      if (k){ k.done = !k.done; bewaar(); tekenInkoop(); }
      return;
    }
    if (e.target.id === "k-btn"){
      var inp = $("#k-add"), v = inp ? inp.value.trim() : "";
      if (!v) return;
      D.klusjes.push({id:uid(), naam:v, done:false}); bewaar(); tekenInkoop();
      var n = $("#k-add"); if (n) n.focus();
      return;
    }
    if (e.target.id === "k-opruim"){
      D.klusjes = D.klusjes.filter(function(k){ return !k.done; }); bewaar(); tekenInkoop(); return;
    }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.id === "k-add"){ e.preventDefault(); var b = $("#k-btn"); if (b) b.click(); }
    if (e.key === "Escape" && host.lastElementChild) sluitPaneel(host.lastElementChild);
  });

  /* ═══ start ══════════════════════════════════════════════ */
  function start(){ $("#app").hidden = false; $("#fab").hidden = false; tekenAlles(); }
  D = laad();
  if (!D.ruimtes.length && !D.items.length) toonSetup(); else start();
})();
</script>
