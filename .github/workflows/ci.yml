name: CI

# Op pull requests; op main draait deploy.yml deze workflow eerst.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests en lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check thuis tests
      - run: ruff format --check thuis tests
      - run: pytest

  image:
    name: Docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t thuis app
      - name: Image start en kan alles importeren
        run: |
          docker run --rm thuis python -c "import thuis.api, thuis.verzamel, google.cloud.bigquery, google.auth.crypt.es256, hyundai_kia_connect_api"
          docker run --rm thuis python -c "from google.cloud.bigquery import Client; assert hasattr(Client, 'query_and_wait')"  # opslag.py
          test "$(docker run --rm thuis id -u)" != 0  # niet als root

  scripts:
    name: Shellscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh
